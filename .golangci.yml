# golangci-lint v2 configuration
# See https://golangci-lint.run/docs/configuration/

version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    # Essential — catches real bugs
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Security
    - gosec

    # Recommended — widely adopted, low false-positive rate
    - bodyclose
    - errorlint
    - misspell
    - modernize    # modern Go simplifications (any-over-interface{}, etc.)
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam

    # Complexity
    - gocyclo
    - dupl         # copy-paste / clone detection (high threshold, see settings)

    # Dependency direction enforcement
    - depguard     # enforce monorepo layering: pkg/ ↛ agm/internal/, no cross-product imports

    # Lint hygiene
    - nolintlint   # every //nolint must carry a linter name + justification

    # Best practices
    - gocritic     # subtle style and performance issues
    - exhaustive   # switch statement exhaustiveness on enums
    - usetesting   # use testing package helpers (t.Setenv, etc.)
    - usestdlibvars # use stdlib constants (http.StatusOK vs 200)

  settings:
    gocyclo:
      min-complexity: 15

    dupl:
      # High token threshold: only flag substantial clone clusters, not
      # incidental 3-line similarities. 150 ≈ ~40+ lines of duplicated logic.
      threshold: 150

    nolintlint:
      # Every //nolint must name the linter(s) it suppresses and carry a
      # human justification — no bare blanket suppressions.
      require-explanation: true
      require-specific: true
      allow-unused: false

    errcheck:
      # Inverted posture: check blank `_ = err` assignments too, so swallowed
      # errors are visible. Genuine fire-and-forget cleanup (Close/Flush in
      # defers) is excluded narrowly via the exclude-functions list below.
      check-blank: true
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*os.File).Sync

    staticcheck:
      # All checks, no suppressions. SA4010 (result of append never used) was
      # suppressed in 013ff3677 as part of trimming the linter set to a
      # then-passing baseline, on the stated plan to re-enable incrementally.
      # It never was, and the one violation it was hiding turned out to be a
      # real bug: GeminiCLIAdapter.ImportConversation decoded its payload and
      # dropped it, so an import produced a session with no history. The
      # module is clean under SA4010 as of that fix, so the suppression is
      # retired rather than baselined.
      checks: ["all"]

    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

    depguard:
      rules:
        # pkg/ is public API; it must not reach into agm's private internals
        pkg-no-agm-internal:
          list-mode: lax
          files:
            - "**/pkg/**/*.go"
          deny:
            - pkg: "github.com/vbonnet/dear-agent/agm/internal/**"
              desc: "pkg/ packages must not import agm/internal/ — pkg is a public API layer; agm/internal is private to the agm product"
        # Product subtrees must not cross-import at the internal level
        no-cross-product-internal:
          list-mode: lax
          files:
            - "**/agm/internal/**/*.go"
          deny:
            - pkg: "github.com/vbonnet/dear-agent/engram/**"
              desc: "agm/internal must not import engram — cross-product imports couple subtrees"
            - pkg: "github.com/vbonnet/dear-agent/wayfinder/**"
              desc: "agm/internal must not import wayfinder — cross-product imports couple subtrees"

  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam
          - gocyclo
          - noctx
          - nilerr
          - revive
          - exhaustive
      # Pre-existing posture: regular unchecked-return findings stay excluded
      # (out of scope for this change). Note the "of `fn`" in the pattern — it
      # matches ONLY the non-blank message ("Error return value of `x` is not
      # checked") and deliberately does NOT match the blank-assignment message
      # ("Error return value is not checked"). That lets errcheck.check-blank
      # surface swallowed `_ = err` discards (T8) which were previously hidden.
      - text: "Error return value of .* is not checked"
        linters:
          - errcheck
      - text: "os/exec.Command must not be called"
        linters:
          - noctx
      # Excluded gosec rules:
      # - G104: errors unhandled (errcheck already covers what matters)
      # - G204: subprocess from variable (we run lots of internal commands)
      # - G301: directory permissions (we set 0o700 explicitly where it matters)
      # Path traversal findings must be suppressed at the call site with a
      # rule-specific //nolint:gosec justification so storage hardening
      # regressions cannot hide behind a global exclusion.
      - text: "G204|G301|G104"
        linters:
          - gosec
      - text: "if-return|exported.*stutters|package-comments"
        linters:
          - revive
      - text: "unnecessary conversion"
        linters:
          - unconvert
    paths:
      - third_party
      - vendor
      - mcp-wizard/node_modules

issues:
  # Baseline the existing backlog so newly-enabled linters (dupl, nolintlint,
  # modernize) and the errcheck.check-blank flip gate *new* regressions without
  # blocking unrelated PRs on the pre-existing violations (positive-guidance
  # posture, .claude/CLAUDE.md §2). Findings are reported only for code changed
  # relative to the merge-base with origin/main; the existing backlog is burned
  # down incrementally under scoped Beads work, not in this enabling PR.
  #
  # Requires full git history in CI — see fetch-depth: 0 on the ci job checkout.
  new-from-merge-base: origin/main
  # Don't auto-discard duplicate or per-linter-capped issues from the "new" set.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt  # two unformatted files reached main; gate new regressions

output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true
