# dear-deploy manifest — the deployable host artifacts of dear-agent.
#
# This is the source of truth for `dear-deploy` (cmd/dear-deploy): each entry
# pairs a source of truth in this repo with the place that artifact is installed
# on the host. `dear-deploy sync` writes them through the principle-9 atomic
# sequence (stage -> verify -> activate); `dear-deploy status` compares each
# deployed copy to its rendered source (the manifest-scoped twin of drift-check).
#
# Fields (see internal/deploy.Artifact):
#   name         stable label used to select the artifact on the command line
#   source       path of the source of truth, relative to the repo root
#   deployed     installed path on the host (~ and $ENV expanded)
#   mode         octal permission of the installed file (default 0644)
#   tokens       placeholder -> value substituted into the source before writing
#                (renders a template to its host form; $HOME is expanded)
#   optional     true => a missing *source* is skipped, not an error
#   remediation  command that produces the source (shown when it is absent)
#
# The deployed paths below are exactly the ones unblocked by the write-guard
# carveouts in ce-k0fj (~/Library/LaunchAgents/com.dear-agent.* and
# ~/.config/claude-code/hooks/pretool-*).

artifacts:
  # --- GOBIN guard and independent liveness auditor (ce-24f1) -------------
  # Both scripts intentionally live outside ~/go/bin so a GOBIN wipe cannot
  # remove them. The auditor has a separate install directory from the guard,
  # so a failed guard deployment cannot also remove its observer. dear-deploy owns installation and
  # drift auditing; launchd activation remains an explicit operator action.
  - name: gobin-guard
    source: scripts/gobin-guard.sh
    deployed: ~/.local/state/dear-agent/bin/gobin-guard.sh
    mode: "0755"

  - name: gobin-guard-audit
    source: scripts/gobin-guard-audit.sh
    deployed: ~/.local/lib/dear-agent/gobin-guard-audit.sh
    mode: "0755"

  - name: com.dear-agent.gobin-guard
    source: deploy/launchd/com.dear-agent.gobin-guard.plist
    deployed: ~/Library/LaunchAgents/com.dear-agent.gobin-guard.plist
    mode: "0644"
    tokens:
      __HOME__: ${HOME}

  - name: com.dear-agent.gobin-guard-audit
    source: deploy/launchd/com.dear-agent.gobin-guard-audit.plist
    deployed: ~/Library/LaunchAgents/com.dear-agent.gobin-guard-audit.plist
    mode: "0644"
    tokens:
      __HOME__: ${HOME}

  # --- launchd plists --------------------------------------------------------
  # The Ralph Wiggum persistent PR-merge loop (ADR-029). The plist is a template:
  # __HOME__ is rendered to the real home directory before it is installed, so the
  # deployed file matches what drift-check expects.
  - name: com.dear-agent.mergeloop
    source: deploy/launchd/com.dear-agent.mergeloop.plist
    deployed: ~/Library/LaunchAgents/com.dear-agent.mergeloop.plist
    mode: "0644"
    tokens:
      __HOME__: ${HOME}

  # Hourly sandbox-dir GC (ce-uxju). The template still requests
  # `agm sandbox gc --reap --json`, but SGC-18 currently makes that request
  # fail before endpoint or candidate access until session-store transport is
  # authenticated. `agm sandbox gc` remains the read-only diagnostic path.
  # Staging this plist does NOT activate it; activation is ask-gated (see the
  # plist header and ~/.agm/cleanup-runbook.md).
  - name: com.dear-agent.sandbox-gc
    source: deploy/launchd/com.dear-agent.sandbox-gc.plist
    deployed: ~/Library/LaunchAgents/com.dear-agent.sandbox-gc.plist
    mode: "0644"
    tokens:
      __HOME__: ${HOME}

  # The disk watchdog (ce-6fel): a 5-minute launchd tick that alarms on low
  # free disk space / high inode usage (free < 20/5 GiB, inodes > 90/95%),
  # writes a watchdog.disk.alarm trail record, and remediates by reaping
  # provably-merged worktree husks. Independent of the VROOM mesh by design:
  # a full disk is exactly the state that takes the mesh down.
  - name: com.dear-agent.disk-watchdog
    source: deploy/launchd/com.dear-agent.disk-watchdog.plist
    deployed: ~/Library/LaunchAgents/com.dear-agent.disk-watchdog.plist
    mode: "0644"
    tokens:
      __HOME__: ${HOME}

  # The absence alarm (ce-23lf7 / ce-o3g5t): a 10-minute launchd tick that
  # alarms on the ABSENCE of expected positive events (mergeloop loaded +
  # ticking, Jaeger receiving traces, the disk-watchdog tick, the gobin-guard
  # heartbeat, the absence-alarm's own heartbeat)
  # instead of the presence of errors. Independent of the mesh by design:
  # a dead mesh is exactly what it exists to notice. Staging does NOT
  # activate: activation is an ask-gated `launchctl bootstrap` (see the
  # plist header).

  # The pulse config is seeded absent-only: dear-deploy writes it on first
  # install but leaves an already-deployed copy alone so operator edits
  # (snoozed pulses, custom probe windows) survive every `dear-deploy sync`.
  - name: com.dear-agent.absence-alarm
    source: deploy/launchd/com.dear-agent.absence-alarm.plist
    deployed: ~/Library/LaunchAgents/com.dear-agent.absence-alarm.plist
    mode: "0644"
    tokens:
      __HOME__: ${HOME}
    create-dirs:
      - ~/.local/state/dear-agent

  - name: absence-alarm-pulses
    source: deploy/absence-alarm/pulses.json
    deployed: ~/.config/dear-agent/absence-alarm-pulses.json
    mode: "0644"
    absent-only: true
    remediation: make install-absence-alarm-launchagent

  # --- Claude Code PreToolUse write-guard hooks ------------------------------
  # Compiled binaries built by `make build-write-guards` into bin/. They are
  # marked optional so `dear-deploy sync` on a machine that has not built them
  # yet reports "skipped (source not built)" instead of failing — build first,
  # then sync. settings.json references them at ~/.config/claude-code/hooks.
  - name: pretool-fs-write-guard
    source: bin/pretool-fs-write-guard
    deployed: ~/.config/claude-code/hooks/pretool-fs-write-guard
    mode: "0755"
    optional: true
    remediation: make build-write-guards

  - name: pretool-bash-write-guard
    source: bin/pretool-bash-write-guard
    deployed: ~/.config/claude-code/hooks/pretool-bash-write-guard
    mode: "0755"
    optional: true
    remediation: make build-write-guards

  # --- Go binaries (version-stamp drift, not byte compare) -------------------
  # kind: binary entries are status-only. Their source of truth is the repo's
  # current commit, not a file in the tree: `dear-deploy status` reads the
  # vcs.revision embedded in the installed binary (`go version -m`) and compares
  # it to repo HEAD, reporting STALE when the deployed binary predates the source
  # it was built from, or NOT DEPLOYED when it is absent. `dear-deploy sync` never
  # writes them — they are (re)built by their remediation command. These are the
  # launchd-driven VROOM daemons whose staleness can silently degrade the mesh
  # (a stale mergeloop merges with outdated policy; a stale vroom-dispatch boots
  # supervisors from old logic), so the Overseer audits them every tick.
  - name: mergeloop
    kind: binary
    source: cmd/mergeloop
    deployed: ~/go/bin/mergeloop
    mode: "0755"
    remediation: make install-mergeloop

  - name: vroom-dispatch
    kind: binary
    source: cmd/vroom-dispatch
    deployed: ~/go/bin/vroom-dispatch
    mode: "0755"
    remediation: make install-vroom-dispatch

  - name: disk-watchdog
    kind: binary
    source: cmd/disk-watchdog
    deployed: ~/go/bin/disk-watchdog
    mode: "0755"
    remediation: make install-disk-watchdog

  # The absence-alarm plist's ProgramArguments points at this binary. Without a
  # binary entry, `dear-deploy status` reports the launch agent current while
  # the executable it needs is missing or stale, and the monitor silently never
  # runs after bootstrap -- the same unwired-detector failure this job exists to
  # catch.
  - name: absence-alarm
    kind: binary
    source: cmd/absence-alarm
    deployed: ~/go/bin/absence-alarm
    mode: "0755"
    remediation: make install-absence-alarm

  # The default pulse registry includes an otel-receiving probe that calls
  # jaeger-health. Without this entry, `dear-deploy status` reports the stack
  # current while the probe binary is missing, and the first absence-alarm tick
  # classifies otel-receiving as UNDETERMINED and alarms spuriously.
  - name: jaeger-health
    kind: binary
    source: cmd/jaeger-health
    deployed: ~/go/bin/jaeger-health
    mode: "0755"
    remediation: make install-jaeger-health

  # The absence-alarm default pulse set includes a merge-health command pulse.
  # Without this entry, `dear-deploy status` reports the stack current while
  # the probe binary is missing, causing the merge-pipeline-recent-commit pulse
  # to classify as UNDETERMINED on every tick.
  - name: merge-health
    kind: binary
    source: cmd/merge-health
    deployed: ~/go/bin/merge-health
    mode: "0755"
    remediation: make install-merge-health
