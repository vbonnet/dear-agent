# dear-agent: per-repo output routing for AI agents.
#
# Agents use this file to decide where to write artifacts they produce.
# It exists so a session running in this repo can deterministically answer
# "where does a research artifact / a session log / a code change go?"
# without having to guess from directory names.
#
# Schema (versioned; bump `version` if you make a breaking change):
#   version              integer, currently 1
#   repo                 logical name of this repository (informational)
#   output-dirs          map of artifact-kind -> filesystem path
#     code               where source code changes go (this repo)
#     research           where research artifacts go (analysis docs,
#                        transcripts, findings, literature reviews)
#     logs               where conversation logs / session transcripts go
#   pr-policy            informational map of PR verbs -> sanctioned command
#                        (mirrors the enforcement in .claude/settings.json)
#   adr-governance       declared ADR directory scopes, self-contained
#                        aggregates, review budget, and reasoned exclusions
#   forbidden-paths      directories where new files of a given kind MUST NOT
#                        be created in THIS repo. Maps kind -> list of globs
#                        relative to repo root.
#
# Resolution: if a kind appears in `forbidden-paths`, an agent that wants
# to write that kind redirects to `output-dirs[kind]` instead. Repos that
# do not list a kind in forbidden-paths inherit no constraint for it.
#
# This file is read by `agm` hooks and by agent CLAUDE.md guidance.
# It is not a runtime sandbox — enforcement is best-effort and advisory,
# but the redirection target IS authoritative: agents should treat it as
# "the answer" rather than re-deriving it from context.

version: 1
repo: dear-agent

output-dirs:
  code: .
  research: ~/src/engram-research
  logs: ~/src/ai-conversation-logs

# PR lifecycle policy (informational mirror of the enforcement in
# .claude/settings.json + .claude/hooks/pretool-pr-guard; the authoritative
# rationale lives in .claude/CLAUDE.md §"PR Lifecycle — Wayfinder-Only").
# Agents read this file at session start: PR open/close in this repo goes
# through the safe-pr wrapper, which requires an active wayfinder session
# (WAYFINDER-STATUS.md status: in_progress) and stamps the session trace on
# the PR. Raw `gh pr create|close|reopen` in Bash is denied with exit 2.
pr-policy:
  create: safe-pr   # safe-pr create --wayfinder <project-dir> --title … --body …
  close: safe-pr    # safe-pr close  --wayfinder <project-dir> <number|url>
  emergency: "safe-pr <verb> --emergency --reason \"<why>\"  # audited, never silent"

# Architecture decisions have directory-scoped numeric identities. Every
# numbered scope owns one complete index; aggregate ADR.md files are
# self-contained. `make lint-adrs` rejects undeclared tracked ADR paths and
# identity, lifecycle, index, size, supersession, or local-link drift.
adr-governance:
  max-lines: 300
  scopes:
    - path: docs/adr
      index: README.md
    - path: agm/docs/adr
      index: README.md
    - path: agm/cmd/agm
      index: ADR-INDEX.md
    - path: agm/cmd/agm-daemon/adr
      index: README.md
    - path: agm/cmd/agm-mcp-server/adr
      index: README.md
    - path: agm/internal/dolt/adr
      index: README.md
    - path: agm/internal/evaluation/ADR
      index: README.md
    - path: agm/internal/tmux
      index: ADR-INDEX.md
    - path: engram/cmd/engram
      index: ADR-INDEX.md
    - path: engram/retrieval/docs/adrs
      index: README.md
    - path: pkg/engram/docs/adrs
      index: README.md
    - path: pkg/llm/docs
      index: ADR-INDEX.md
    - path: tools/dod-enforcer/adr
      index: README.md
  aggregates:
    - path: engram/ecphory/ADR.md
    - path: engram/ecphory/ranking/ADR.md
    - path: pkg/hash/ADR.md
    - path: pkg/monitoring/ADR.md
    - path: pkg/telemetry/ADR.md
    - path: tools/devlog/ADR.md
  exclusions:
    - match: "**/testdata/**"
      reason: generated or parser fixture, not a living architectural decision
    - match: "**/vendor/**"
      reason: vendored third-party content is outside repository governance
    - match: "**/node_modules/**"
      reason: generated dependency content is outside repository governance

forbidden-paths:
  research:
    # Research artifacts — analysis docs, transcripts, literature reviews,
    # findings — belong in ~/src/engram-research, not in this repo.
    - research/*.md
    - research/*.txt
    # TEMPORAL ARTIFACTS — design docs, plans, audits, DEAR retros, research,
    # and Wayfinder artifacts (W0/problem statements). They capture a moment
    # of thinking, are NOT maintained with the code, and ALWAYS route to the
    # knowledge base ~/src/engram-research (projects/<name>/), never this live
    # coding repo — even when the artifact is about code here.
    #
    # LIVING DOCUMENTATION stays in dear-agent, as close to the code as
    # possible (proximity principle): ARCHITECTURE.md, ADRs (docs/adr/),
    # inline/API docs, CLAUDE.md — anything kept true as the code changes.
    # See .claude/CLAUDE.md "Documentation & Artifact Routing" for the full
    # policy (Last-audited headers, wrong-fact-triggers-retro, doc audits).
    #
    # (Pre-existing specs in docs/design/ that CLAUDE.md and code reference as
    # authoritative — anti-stall.md, graceful-exit.md, outcomes-framework.md —
    # behave like living docs and remain in-repo for now; reclassifying vs.
    # migrating them is tracked separately. New design docs follow this rule.)
    - docs/retros/**
    - docs/design/**
    - wf/**
    # Wayfinder SDLC run artifacts (phase outputs). These are temporal: a
    # moment-in-time record of a Wayfinder run, NOT maintained with the code.
    # They route to engram-research/wf/<project>/. The Wayfinder TOOL SOURCE
    # (wayfinder/, *.go, validator testdata, docs/adr/ADR-031) is living
    # code/docs and is deliberately NOT matched here. See the 2026-06-19 DEAR
    # retro (engram-research) for why these globs exist.
    - "**/.wayfinder/**"
    - "**/WAYFINDER-STATUS.md"
    - "**/WAYFINDER-HISTORY.md"

# Framework-level defaults applied to every task in this repo. These
# travel with the session, not the prompt, so a worker (and any
# sub-agent it spawns) cannot accidentally forget them.
#
# `graceful-exit` is the no-overfit guardrail: "nothing fits" is a
# first-class valid outcome — saying so is better than inflating a
# weak match. See pkg/gracefulexit and ADR-018. The default is ON.
# To opt out (rare; e.g. a synthetic generator that must always emit
# a row), set `disabled: true` and document `why:`.
framework-defaults:
  graceful-exit:
    # disabled: false  # default — leave the guardrail on
    # why: ""          # required only when disabled: true

# DEAR Define-phase exit conditions for tasks in this repo. The list
# is informational, not a blocking gate: workers see it at session
# start (via `agm acceptance show`) and the Audit phase verifies the
# runnable rows after completion. Recognized types are tests-pass,
# lint-clean, no-regressions, and custom — see pkg/acceptance.
acceptance-criteria:
  - type: tests-pass
    command: "go test ./..."
  - type: lint-clean
    command: "golangci-lint run ./..."
  - type: no-regressions
    description: "No previously-passing test is now failing"

# DEAR Audit subsystem configuration. See ADR-011 and pkg/audit/config.
# This is the dogfood configuration: dear-agent itself runs the daily
# checks below on every push (via the workflow-audit CLI in CI). The
# weekly / monthly tiers cost more and run from a scheduled trigger.
#
# Severity policy is the package default; we leave it implicit. Override
# only when this repo deviates from the recommended P0/P1/P2/P3 actions.
audits:
  schedule:
    daily:
      - check: build
      - check: test
        config:
          # Skip -race in CI to keep the daily under 5 min; the weekly
          # tier picks it up.
          race: false
          timeout: "3m"
      - check: lint.go
      - check: vuln.govulncheck

    weekly:
      # Re-run the daily set with the expensive flags turned on. The
      # registry resolves these to the same checks; .config differs.
      - check: build
      - check: test
        config:
          race: true
          timeout: "10m"
      - check: lint.go
      - check: vuln.govulncheck

    # The monthly tier is currently empty — the expensive checks
    # (test-quality, complexity, docs.staleness, license,
    # security.deep) ship in v1.x per ADR-011 §"Implementation plan".
    # Leaving the bucket declared but empty documents the cadence so
    # the schedule lines up with future check additions.
    monthly: []

    # On-demand bucket: the spec.coverage check (Outcomes framework,
    # docs/design/outcomes-framework.md) lives here because its signal
    # moves slowly and a missing SPEC.md is informational drift, not
    # breakage. Promote to weekly once dear-agent itself reaches
    # full coverage.
    on-demand:
      - check: spec.coverage
