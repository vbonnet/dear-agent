version: '3.8'

services:
  # OAuth mock server container (for E2E tests)
  oauth-mock:
    image: node:20-alpine
    command: sh -c "npx oauth2-mock-server --port 8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 2s
      timeout: 1s
      retries: 10
    profiles:
      - e2e

  # E2E test runner container
  e2e-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    command: npm run test:e2e
    depends_on:
      oauth-mock:
        condition: service_healthy
    environment:
      OAUTH_MOCK_URL: http://oauth-mock:8080
      NODE_ENV: test
      CI: "true"
    network_mode: host
    volumes:
      - ./logs:/app/logs
    profiles:
      - e2e

  # Integration test runner container (runs by default)
  integration-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    command: npm test -- tests/integration/
    environment:
      NODE_ENV: test
      CI: "true"
    volumes:
      - ./coverage:/app/coverage
    profiles:
      - integration
      - default
