[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts = -v --tb=short --strict-markers

# Markers (for future test categorization)
markers =
    violations: Tests for tool usage violation detection
    legitimate: Tests for legitimate security prompts
    edge_cases: Tests for edge case handling
    bug_regression: Regression tests for Bug #1 and Bug #2
    batched: Tests for batched prompt handling (C8 requirement)
    false_positive: Tests for false positive prevention (C9 requirement)
