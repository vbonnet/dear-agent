# Mergify configuration for dear-agent.
#
# Conditions here are kept in lock-step with the branch-protection rules on
# `main`. As of 2026-06-09 the required status checks are:
#   - Build & Test (ubuntu-latest)
#   - Build & Test (macos-latest)
#   - Analyze Go Code (go)
#   - govulncheck
#   - Vulnerability Scan
#   - Bash Script Size Check (20-line limit)
# plus required_conversation_resolution=true (modelled by
# `#review-threads-unresolved=0`).
#
# IMPORTANT: if a required check is added/removed/renamed in branch
# protection, update BOTH the `queue_rules.merge_conditions` and every
# `pull_request_rules.conditions` block below, or Mergify will silently
# diverge from the real gate. Mergify cannot merge past branch protection,
# so a stale (weaker) config here fails closed — but a stale (stronger)
# config silently stops merging.

queue_rules:
  - name: default
    merge_conditions:
      - check-success=Build & Test (ubuntu-latest)
      - check-success=Build & Test (macos-latest)
      - check-success=Analyze Go Code (go)
      - check-success=govulncheck
      - check-success=Vulnerability Scan
      - check-success=Bash Script Size Check (20-line limit)
      - "#review-threads-unresolved=0"

pull_request_rules:
  - name: Queue when all required checks pass and conversations resolved
    conditions:
      - base=main
      - label!=do-not-merge
      - "#review-threads-unresolved=0"
      - check-success=Build & Test (ubuntu-latest)
      - check-success=Build & Test (macos-latest)
      - check-success=Analyze Go Code (go)
      - check-success=govulncheck
      - check-success=Vulnerability Scan
      - check-success=Bash Script Size Check (20-line limit)
    actions:
      queue:
        name: default
        merge_method: squash

  # Dependabot bumps follow the SAME gate as everything else — in particular
  # they must pass govulncheck and Vulnerability Scan, since a dependency bump is exactly
  # where a vulnerability scan matters most. No relaxed path.
  - name: Queue dependabot under the full required-check gate
    conditions:
      - author=dependabot[bot]
      - base=main
      - label!=do-not-merge
      - "#review-threads-unresolved=0"
      - check-success=Build & Test (ubuntu-latest)
      - check-success=Build & Test (macos-latest)
      - check-success=Analyze Go Code (go)
      - check-success=govulncheck
      - check-success=Vulnerability Scan
      - check-success=Bash Script Size Check (20-line limit)
    actions:
      queue:
        name: default
        merge_method: squash
