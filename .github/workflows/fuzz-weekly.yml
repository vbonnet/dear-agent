name: Weekly Fuzz Sweep

# Runs Go's built-in fuzzer against fuzz targets for a fixed budget.
# Findings (new crash inputs) are committed as seed-corpus entries via a PR
# so they become permanent regression tests. Any panic found causes the run
# to exit non-zero.
#
# Run weekly rather than on every PR because fuzzing is CPU-intensive and
# long-running (seconds of useful coverage vs. CI's time budget).

on:
  schedule:
    - cron: "0 5 * * 0"  # Sundays at 05:00 UTC
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: "Fuzz duration per target (e.g. 60s, 5m)"
        default: "60s"
        required: false

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: FuzzClassify
            pkg: ./internal/fsguard
          - target: FuzzExpand
            pkg: ./internal/fsguard
          - target: FuzzUnder
            pkg: ./internal/fsguard
          - target: FuzzInspectCommand
            pkg: ./internal/fsguard
          - target: FuzzTokenize
            pkg: ./internal/fsguard

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz ${{ matrix.target }}
        env:
          FUZZ_TIME: ${{ inputs.fuzz_time || '60s' }}
        run: |
          go test -fuzz=${{ matrix.target }} -fuzztime="${FUZZ_TIME}" ${{ matrix.pkg }}

      - name: Upload crash corpus on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            ${{ matrix.pkg }}/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: ignore
