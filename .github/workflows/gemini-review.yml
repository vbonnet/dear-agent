name: Gemini PR Review

# Gemini-powered PR review via Google's official run-gemini-cli action, using
# the `code-review` extension + GitHub MCP server to post INLINE review
# comments — the same experience the (now-sunset, 2026-07-17) consumer
# gemini-code-assist GitHub app provided, but driven by our own API key.
#
# Auth: GEMINI_API_KEY secret — an AI Studio "Gemini Developer API" key.
#   The free tier costs nothing within its rate limits; if those prove too
#   tight, the same key can be upgraded to pay-as-you-go billing on the
#   brain-v2-gmail project. (Google AI Ultra is a consumer-app entitlement and
#   is NOT reachable from a GitHub Action, so it cannot back this workflow.)
#
# Model: set the repo/org Actions VARIABLE `GEMINI_MODEL` to override (e.g.
#   `gemini-2.5-flash` for the most generous free-tier limits, or
#   `gemini-2.5-pro` for the strongest review). Unset → the action's default.
#
# The job no-ops cleanly until GEMINI_API_KEY is present, skips PRs from forks
# (which have no access to repo secrets), and skips drafts until GitHub emits
# the ready_for_review event. The retired Code Assist configuration is not an
# input to this workflow; the review policy below is its single owner.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    name: Gemini Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Forks cannot read repository secrets; defer drafts until ready_for_review.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    steps:
      - name: Gate on secret presence
        id: gate
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::GEMINI_API_KEY not set; skipping Gemini review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Check out only the trusted base revision. The reviewer reads the PR
      # diff through the GitHub MCP server; this checkout supplies canonical
      # GEMINI.md/AGENTS.md instructions without putting PR-controlled files
      # (including a malicious .gemini config) in the trusted workspace.
      - name: Checkout trusted base instructions
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      # A timed-out Gemini invocation can strand its bot-owned pending review.
      # The extension is designed to reuse that draft, but retries can then
      # block indefinitely before submitting it. Human drafts are never
      # visible to this token and are also excluded explicitly.
      - name: Clear stale Gemini pending review
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --jq '.[] | select(.state == "PENDING" and .user.login == "github-actions[bot]") | .id' |
          while IFS= read -r review_id; do
            [ -z "$review_id" ] ||
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews/${review_id}"
          done

      - name: Run Gemini PR review
        if: steps.gate.outputs.skip != 'true'
        uses: google-github-actions/run-gemini-cli@v0
        env:
          # SECURITY / trust model — read before editing (GHSA-wpqr-6v78-jr5g):
          # Headless Gemini CLI REQUIRES a trusted workspace to install the
          # code-review extension; with trust 'false' the install hangs on an
          # interactive confirmation until the job times out. The exfiltration
          # risk that trust guards against needs attacker-controlled files in
          # the workspace — which we remove structurally by checking out only
          # the trusted base revision (see above), and by gating this job to same-repo,
          # non-fork PRs only. Per the advisory this is the sanctioned
          # trusted-input configuration. Keep 'true' AND the checkout pinned
          # to the trusted base revision.
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          github_pr_number: ${{ github.event.pull_request.number }}
          workflow_name: gemini-review
          settings: |-
            {
              "model": { "maxSessionTurns": 25 },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run", "-i", "--rm",
                    "-e", "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}" }
                }
              },
              "tools": { "core": [] }
            }
          extensions: |
            [
              "https://github.com/gemini-cli-extensions/code-review"
            ]
          prompt: |-
            /pr-code-review

            Repository review policy:
            - Report only medium- or high-severity actionable findings.
            - Do not review generated protobufs, generated Go files, mocks,
              testdata, vendored files, lockfiles, or minified JavaScript.
