name: Main Health Watchdog

# Watches main for red checks and, when it finds one, answers the question a
# bare "main is red" alert does not: HOW did this get past pre-merge, and can
# filter selection be refined so the next one does not?
#
# Relationship to ci-health-monitor.yml: that job alarms on a SUSTAINED red
# streak (3 of the last 5 CI runs, every 8 hours) and only watches the CI
# workflow. This one fires on the FIRST red, covers every workflow that gates
# main, and files an incident brief with an escape classification and a
# prevention-vs-cure calculation. The brief becomes a DEAR retro once whoever
# fixes the failure appends the Execute and Audit sections — at detection time
# only Define is knowable, so claiming a completed retrospective would be a
# claim the policy can check. They overlap on "main is red" and are
# deliberately left separate for now — consolidating them is ce-xulg.13.
#
# Why a GitHub scheduled workflow rather than launchd: the facts it needs
# (check conclusions, required contexts, run durations) all live in the GitHub
# API, and the runner is already authenticated. A host job would add a machine
# that has to be up for main to be watched.
#
# The analysis is Go (tools/ci-escape-analysis, pkg/cihealth) rather than
# inline bash, so the classification and the ROI arithmetic are unit-tested
# instead of being a shell script nobody dares change.

on:
  # Fast path: react to a workflow finishing on main.
  workflow_run:
    workflows:
      - CI
      - CodeQL Security Analysis
      - SBOM and Security Scan
      - Language Policy Enforcement
      - Structural Health
      - ADR Integrity
      - Doc Header Lint
      - Instruction Policy Integrity
      - Routing Enforcement
    types: [completed]
    # Only completions on main say anything about main's health. Without this
    # every one of those workflows finishing on a pull-request branch launches
    # a full repository-wide sweep and appends another "Still red" comment to
    # any open incident, turning ordinary PR activity into issue noise.
    branches: [main]
  # Safety net: catches anything the event path missed (dropped webhook, a
  # workflow added to main without being added to the list above, a red run
  # that predates this workflow).
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  group: main-health-watchdog
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read
  # Reading which pull request introduced a commit
  # (repos/:repo/commits/:sha/pulls) needs this. Without it the lookup is
  # denied, the helper degrades to PR 0, and every ordinary merge is classified
  # as a bypass.
  pull-requests: read

jobs:
  sweep:
    name: Sweep main for red checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # `incident` is the one queued incident this sweep handed off, or empty.
      # The sweep files a brief per red workflow and labels each as queued;
      # dequeuing takes the oldest, drops the label, and names it here. So a
      # red workflow that is already being worked does not re-dispatch an agent
      # every four hours, and simultaneous incidents are picked up one per
      # sweep instead of all but the first being dropped.
      incident: ${{ steps.sweep.outputs.incident }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # One code path for both triggers: always sweep. The workflow_run event
      # is only a reason to look sooner, never a separate branch of logic —
      # two code paths would mean the scheduled one rots unexercised.
      #
      # The sweep is idempotent: it files a retro per red workflow, comments on
      # the existing one if it is already open, and closes retros whose
      # workflow has recovered.
      - name: Sweep main, file or update incident briefs
        id: sweep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          go run ./tools/ci-escape-analysis --repo "${{ github.repository }}" --sweep | tee sweep.log
          # The sweep prints at most one NEW INCIDENT line: the incident it
          # dequeued. Everything else stays queued for a later sweep.
          incident=$(grep -m1 '^NEW INCIDENT: ' sweep.log | cut -d' ' -f3- || true)
          echo "incident=${incident}" >> "$GITHUB_OUTPUT"

  # Triggering the fix. This deliberately does NOT post "@claude" on the issue
  # and hope: an issue opened by GITHUB_TOKEN does not fire the `issues` event
  # (GitHub's own recursion guard), and the bot's author_association would fail
  # claude.yml's OWNER/MEMBER/COLLABORATOR check anyway. So the watchdog runs
  # the fix agent itself, with the retro as its brief.
  fix:
    name: Trigger a fix
    needs: sweep
    if: needs.sweep.outputs.incident != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The agent's whole job is to push a branch and open a pull request, so
      # `contents: read` would end every successful repair at an authorization
      # denial. `issues: write` covers the documented fallback of commenting
      # its findings on the retro. `actions: read` lets it read the failing
      # run's logs — the retro carries a check name and a URL, not the
      # diagnostic output.
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Dispatch fix agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Job-level `permissions:` govern the workflow token; the action
          # needs Actions read granted through its own surface as well before
          # it will read run logs. Both are required — see claude.yml.
          additional_permissions: |
            actions: read
          prompt: |
            `main` is red on ${{ github.repository }}. The Main Health Watchdog has
            filed exactly one new incident brief, and it is the only incident you are
            to work on:

                ${{ needs.sweep.outputs.incident }}

            Find it with `gh issue list --label main-health-watchdog --state open`.
            Other issues carrying that label are separate incidents already being
            worked; leave them alone.

            The brief already contains an escape classification and a
            prevention-vs-cure ROI calculation. Do not redo that analysis — act on it.
            Terms it marks ASSUMED or LOWER BOUND are not evidence, and a verdict
            marked PROVISIONAL is not an instruction.

            Your job, in order:
            1. Fix the actual failure so main goes green. That is the priority.
            2. Then act on the brief's classification, and ONLY on it:
               - `never-ran`: the producing workflow's own `on.pull_request.paths`
                 filter excluded the change. Widen it there, or move the filter to a
                 job-level `if:` so a skip is visible instead of silent.
               - `selection-gap`: a job-level condition skipped the check. Widen that
                 condition; if the skip came from the affected-test selector
                 (`cmd/test-affected`, ADR-028), fix the selector's dependency walk.
               - `merge-skew`: do NOT touch path filters. Re-run the job to separate
                 flake from semantic merge skew, and say which it was.
               - `inconclusive`: the pre-merge run never concluded. Establish why
                 (superseded push, timeout, malformed workflow) before anything else.
               - `scope-gap`: the diff-scoping is working as designed. Only widen the
                 pre-merge scope if the brief's ROI ratio cleared 10:1 AND was not
                 marked PROVISIONAL.
               - `post-merge-only`: not an escape. Fix the finding, change no filters.
               - `gating-gap` or `bypassed`: this is a ruleset/branch-protection
                 question, not a CI-filtering one. Write up what should change and
                 stop — ruleset edits are a control surface and need a human.

            3. Complete the brief: fill in `Execute` with what you changed and the
               PR link, and `Audit` with whether main went green and whether the
               prevention actually landed.
            4. If the defect was systemic, write the DEAR retro itself into the
               configured research repository (`.dear-agent.yml` > `research`, i.e.
               engram-research) per the DEAR retrospectives policy. This issue is an
               incident alert and lives in the code repo; the durable retro does not
               belong here, and `forbidden-paths` blocks committing one.

            Open one focused PR for this one incident. Do not modify the repository
            ruleset. Do not self-merge. If the fix is not obvious within your budget,
            comment your findings on the brief and stop rather than guessing.
