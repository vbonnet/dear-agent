name: Branch Protection Audit

# Daily fail-closed audit of the private managed-repository inventory. Exact
# repository identities and provider responses stay in shell memory on the
# trusted default-branch run; public logs and issues contain aggregate results
# only.
#
# REQUIRED SECRETS:
#   INFRA_GITHUB_TOKEN  cross-repo PAT with repo + read:org scope
#   INFRA_ACTIVE_REPOS  complete private active_repos JSON value

on:
  schedule:
    - cron: "0 14 * * *"
  # repository_dispatch always runs the last commit on the default branch; it
  # cannot select an untrusted ref for this secret-bearing audit.
  repository_dispatch:
    types: [branch-protection-audit]

permissions:
  issues: write
  contents: read

env:
  GIT_TERMINAL_PROMPT: "0"
  CHECK_EVIDENCE_MAX_AGE_DAYS: "30"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted canonical policy
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Audit branch protections across managed repos
        env:
          GH_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
          ACTIVE_REPOS_JSON: ${{ secrets.INFRA_ACTIVE_REPOS }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          : "${GH_TOKEN:?INFRA_GITHUB_TOKEN is required for complete cross-repo evidence}"
          : "${ACTIVE_REPOS_JSON:?INFRA_ACTIVE_REPOS is required for the private managed inventory}"

          if ! repo_lines=$(jq -er '
              if type == "object" and (keys | length) > 0 and has("dear-agent")
              then keys | sort | .[]
              else error("active inventory must be a non-empty object containing dear-agent")
              end
            ' <<<"$ACTIVE_REPOS_JSON"); then
            echo "::error::INFRA_ACTIVE_REPOS is not a valid managed inventory"
            exit 1
          fi

          finding_count=0
          audited_count=0
          total_count=$(wc -l <<<"$repo_lines" | tr -d ' ')
          if [[ ! "$CHECK_EVIDENCE_MAX_AGE_DAYS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::CHECK_EVIDENCE_MAX_AGE_DAYS must be a positive integer"
            exit 1
          fi
          check_evidence_cutoff_epoch=$(( $(date -u +%s) - CHECK_EVIDENCE_MAX_AGE_DAYS * 86400 ))
          check_evidence_cutoff_iso=$(date -u -d "@${check_evidence_cutoff_epoch}" +%Y-%m-%dT%H:%M:%SZ)
          # Bounds the default-branch commit walk-back below: each candidate
          # costs its own timeout-bounded check-runs API call, so this caps
          # worst-case cost on a busy repository rather than letting the walk
          # scale with however many commits landed in the window.
          branch_walk_max_commits=20

          record_finding() {
            finding_count=$((finding_count + 1))
            echo "::warning::$1; managed repository identity withheld"
          }

          while IFS= read -r repo; do
            audited_count=$((audited_count + 1))
            slug="${OWNER}/${repo}"
            echo "Auditing managed repository ${audited_count}/${total_count} (identity withheld)"

            if ! repo_data=$(timeout 30 gh api "repos/${slug}" 2>/dev/null); then
              record_finding "repository evidence is inaccessible"
              continue
            fi
            if ! default_branch=$(jq -er '.default_branch | strings | select(length > 0)' <<<"$repo_data"); then
              record_finding "default-branch evidence is malformed"
              continue
            fi
            if ! default_branch_path=$(jq -rn --arg value "$default_branch" '$value | @uri'); then
              record_finding "default-branch path cannot be encoded"
              continue
            fi
            if ! repo_config=$(jq -cer --arg repo "$repo" '.[$repo] | select(type == "object")' <<<"$ACTIVE_REPOS_JSON"); then
              record_finding "private inventory entry is malformed"
              continue
            fi

            if [[ "$repo" == "dear-agent" ]]; then
              if ! expected=$(jq -cS -f .github/rulesets/normalize.jq .github/rulesets/main.json); then
                echo "::error::canonical ruleset source is malformed"
                exit 1
              fi
            else
              # Policy construction lives in .github/rulesets/generic-repo-
              # expected-policy.jq (tested by tests/jq/runner_test.go) rather
              # than inline here, per the 20-line bash policy in
              # .github/workflows/AGENTS.md.
              if ! expected_policy=$(jq -c -f .github/rulesets/generic-repo-expected-policy.jq <<<"$repo_config"); then
                record_finding "private inventory policy is malformed"
                continue
              fi
              if ! expected=$(jq -cS -f .github/rulesets/normalize.jq <<<"$expected_policy"); then
                record_finding "private inventory policy cannot be normalized"
                continue
              fi
            fi

            # Rulesets are the sole managed protection mechanism. Distinguish
            # the expected 404 (no classic protection) from an unreadable API.
            if classic_result=$(timeout 30 gh api \
                "repos/${slug}/branches/${default_branch_path}/protection" \
                -H "Accept: application/vnd.github+json" 2>&1); then
              record_finding "legacy classic protection exists"
            elif [[ "$classic_result" != *"HTTP 404"* ]]; then
              record_finding "classic-protection evidence is unavailable"
              continue
            fi

            # Ask GitHub which rules actually apply to this concrete branch.
            # Inspecting only ruleset include markers misses explicit ref
            # patterns such as refs/heads/main and can hide competing authority.
            if ! evaluated_rule_pages=$(timeout 30 gh api --paginate --slurp \
                "repos/${slug}/rules/branches/${default_branch_path}?per_page=100" 2>/dev/null); then
              record_finding "evaluated branch-rules evidence is unavailable"
              continue
            fi
            if ! evaluated_ruleset_ids=$(jq -ce '
                if type == "array"
                    and all(.[];
                      type == "array"
                      and all(.[];
                        type == "object"
                        and (.ruleset_id | type) == "number"
                        and .ruleset_id > 0))
                then flatten(1) | map(.ruleset_id) | unique
                else error("unexpected evaluated branch-rules response")
                end
              ' <<<"$evaluated_rule_pages"); then
              record_finding "evaluated branch-rules evidence is malformed"
              continue
            fi

            active_default_rulesets=$(jq -r 'length' <<<"$evaluated_ruleset_ids")
            if [[ "$active_default_rulesets" -ne 1 ]]; then
              record_finding "default branch does not have exactly one active ruleset authority"
              continue
            fi

            canonical_matches=0
            ruleset_detail=""
            rid=$(jq -r '.[0]' <<<"$evaluated_ruleset_ids")
            if ! detail=$(timeout 30 gh api "repos/${slug}/rulesets/${rid}" 2>/dev/null); then
              record_finding "ruleset-detail evidence is unavailable"
              continue
            fi
            if live_policy=$(jq -cS -f .github/rulesets/normalize.jq <<<"$detail") && [[ "$live_policy" == "$expected" ]]; then
              canonical_matches=1
              ruleset_detail="$detail"
            fi
            if [[ "$canonical_matches" -ne 1 ]]; then
              record_finding "active ruleset does not match the complete canonical policy"
              continue
            fi
            echo "  exactly one canonical repository ruleset"

            if ! required_checks=$(jq -ce '
                [.rules[] | select(.type == "required_status_checks")][0]
                .parameters.required_status_checks // []
                | map({context, integration_id: (.integration_id // null)})
              ' <<<"$ruleset_detail"); then
              record_finding "required-check policy evidence is malformed"
              continue
            fi
            if [[ "$(jq -r 'length' <<<"$required_checks")" -eq 0 ]]; then
              continue
            fi

            produced_checks='[]'
            collect_check_runs() {
              local ref="$1" ref_path check_pages page_checks
              if ! ref_path=$(jq -rn --arg value "$ref" '$value | @uri'); then
                return 2
              fi
              if ! check_pages=$(timeout 30 gh api --paginate --slurp \
                  "repos/${slug}/commits/${ref_path}/check-runs?filter=all&per_page=100" 2>/dev/null); then
                return 1
              fi
              if ! page_checks=$(jq -ce --argjson cutoff "$check_evidence_cutoff_epoch" '
                  if type == "array"
                      and all(.[];
                        type == "object"
                        and (.check_runs | type) == "array"
                        and all(.check_runs[];
                          (.name | type) == "string"
                          and (.name | length) > 0
                          and (.app | type) == "object"
                          and (.app.id | type) == "number"
                          and ((.completed_at // .started_at) | type) == "string"
                          and (try ((.completed_at // .started_at) | fromdateiso8601) catch null) != null))
                  then [
                    .[].check_runs[]
                    | {
                        context: .name,
                        integration_id: .app.id,
                        produced_at: ((.completed_at // .started_at) | fromdateiso8601)
                      }
                    | select(.produced_at >= $cutoff)
                    | {context, integration_id}
                  ]
                  else error("unexpected paginated check-run response")
                  end
                ' <<<"$check_pages"); then
                return 2
              fi
              if ! produced_checks=$(jq -cn \
                  --argjson prior "$produced_checks" \
                  --argjson current "$page_checks" \
                  '$prior + $current | unique_by(.context, .integration_id)'); then
                return 2
              fi
            }

            evidence_error=""
            if collect_check_runs "$default_branch"; then
              :
            else
              case $? in
                1) evidence_error="required-check production evidence is unavailable" ;;
                *) evidence_error="required-check production evidence is malformed" ;;
              esac
            fi
            if [[ -z "$evidence_error" ]]; then
              if ! missing_checks=$(jq -cn \
                  --argjson expected "$required_checks" \
                  --argjson produced "$produced_checks" \
                  '{expected: $expected, produced: $produced}' \
                  | jq -ce -f .github/rulesets/missing-required-checks.jq); then
                evidence_error="required-check production evidence is malformed"
              fi
            fi

            # A required check that last produced evidence on an earlier
            # default-branch commit — not the current tip — still counts as
            # recent: walk back through default-branch commits within the
            # cutoff window before concluding evidence is missing.
            if [[ -z "$evidence_error" && "$(jq -r 'length' <<<"$missing_checks")" -gt 0 ]]; then
              if ! branch_commit_pages=$(timeout 30 gh api --paginate --slurp \
                  "repos/${slug}/commits?sha=${default_branch_path}&since=${check_evidence_cutoff_iso}&per_page=100" 2>/dev/null); then
                evidence_error="required-check production evidence is unavailable"
              elif ! branch_refs=$(jq -ce --argjson cap "$branch_walk_max_commits" '
                  if type == "array"
                      and all(.[];
                        type == "array"
                        and all(.[]; type == "object" and (.sha | type) == "string" and (.sha | length) > 0))
                  then flatten(1) | map(.sha) | unique | .[0:$cap]
                  else error("unexpected paginated commits response")
                  end
                ' <<<"$branch_commit_pages"); then
                evidence_error="required-check production evidence is malformed"
              else
                # Each iteration issues its own timeout-bounded API call
                # (collect_check_runs), so an unbounded commit count here
                # could exhaust the job's timeout on a busy repository before
                # a genuinely-missing check is ever concluded. branch_refs is
                # already capped to branch_walk_max_commits above.
                while IFS= read -r candidate_ref; do
                  if collect_check_runs "$candidate_ref"; then
                    :
                  else
                    case $? in
                      1) evidence_error="required-check production evidence is unavailable" ;;
                      *) evidence_error="required-check production evidence is malformed" ;;
                    esac
                    break
                  fi
                  if ! missing_checks=$(jq -cn \
                      --argjson expected "$required_checks" \
                      --argjson produced "$produced_checks" \
                      '{expected: $expected, produced: $produced}' \
                      | jq -ce -f .github/rulesets/missing-required-checks.jq); then
                    evidence_error="required-check production evidence is malformed"
                    break
                  fi
                  if [[ "$(jq -r 'length' <<<"$missing_checks")" -eq 0 ]]; then
                    break
                  fi
                done < <(jq -r '.[]' <<<"$branch_refs")
              fi
            fi

            # Checks can be PR-only or path-filtered, so broaden a still-missing
            # default-branch result to the twenty most recently updated PR heads
            # whose pull requests target that same default branch.
            if [[ -z "$evidence_error" && "$(jq -r 'length' <<<"$missing_checks")" -gt 0 ]]; then
              if ! pull_heads=$(timeout 30 gh api \
                  "repos/${slug}/pulls?base=${default_branch_path}&state=all&sort=updated&direction=desc&per_page=20" 2>/dev/null); then
                evidence_error="required-check production evidence is unavailable"
              elif ! recent_refs=$(jq -ce '
                  if type == "array"
                      and all(.[];
                        type == "object"
                        and (.head | type) == "object"
                        and (.head.sha | type) == "string"
                        and (.head.sha | length) > 0)
                  then [.[0:20][].head.sha] | unique
                  else error("unexpected pull-request response")
                  end
                ' <<<"$pull_heads"); then
                evidence_error="required-check production evidence is malformed"
              else
                while IFS= read -r candidate_ref; do
                  if collect_check_runs "$candidate_ref"; then
                    :
                  else
                    case $? in
                      1) evidence_error="required-check production evidence is unavailable" ;;
                      *) evidence_error="required-check production evidence is malformed" ;;
                    esac
                    break
                  fi
                  if ! missing_checks=$(jq -cn \
                      --argjson expected "$required_checks" \
                      --argjson produced "$produced_checks" \
                      '{expected: $expected, produced: $produced}' \
                      | jq -ce -f .github/rulesets/missing-required-checks.jq); then
                    evidence_error="required-check production evidence is malformed"
                    break
                  fi
                  if [[ "$(jq -r 'length' <<<"$missing_checks")" -eq 0 ]]; then
                    break
                  fi
                done < <(jq -r '.[]' <<<"$recent_refs")
              fi
            fi

            if [[ -n "$evidence_error" ]]; then
              record_finding "$evidence_error"
            elif [[ "$(jq -r 'length' <<<"$missing_checks")" -gt 0 ]]; then
              record_finding "required check identities lack recent check-run evidence (maximum age ${CHECK_EVIDENCE_MAX_AGE_DAYS} days)"
            fi
          done <<<"$repo_lines"

          {
            echo "finding_count=$finding_count"
            echo "audited_count=$audited_count"
            echo "total_count=$total_count"
          } >> "$GITHUB_ENV"

      - name: Open or update aggregate branch-protection issue
        if: ${{ env.finding_count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="branch-protection: managed inventory drift detected"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Branch Protection Audit found ${finding_count} finding(s) across ${audited_count}/${total_count} managed repositories. Exact identities and provider details are intentionally withheld from this public issue. Re-run the same audit in a private trusted environment with the canonical inventory, then reconcile through the independently verified OpenTofu saved-plan workflow. Run: ${run_url}"
          existing=$(timeout 30 gh issue list --repo "$REPO" --label branch-protection --state open --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            timeout 30 gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            timeout 30 gh issue create --repo "$REPO" --title "$title" --body "$body" --label branch-protection
          fi

      - name: Auto-close branch-protection issue after complete clean evidence
        if: ${{ env.finding_count == '0' && env.audited_count == env.total_count }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(timeout 30 gh issue list --repo "$REPO" --label branch-protection --state open --json number --jq '.[].number')
          for n in $existing; do
            timeout 30 gh issue close "$n" --repo "$REPO" --comment "Complete aggregate audit is clean; exact managed identities remain private."
          done

      - name: Enforce aggregate audit result
        if: ${{ env.finding_count != '0' }}
        run: |
          echo "::error::${finding_count} managed branch-protection finding(s); details withheld"
          exit 1
