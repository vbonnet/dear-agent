name: PR Size and Scope

on:
  pull_request:
    # `edited` covers a base-branch retarget (e.g. develop -> main), which
    # GitHub reports without a new head commit — without it a retargeted PR
    # keeps stale metrics from its former base until the next push.
    types: [opened, reopened, synchronize, ready_for_review, edited]
    branches: [main, develop]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-size-scope-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MAX_CHANGED_LINES: "1000"
  MAX_CHANGED_FILES: "50"
  MAX_TOP_LEVEL_AREAS: "4"
  # Added non-test source lines that must accompany a pure source-file move
  # before the diff counts as mixing a refactor with new logic.
  MIN_NEW_LOGIC_LINES: "50"

jobs:
  size-scope:
    name: Size and scope signal
    runs-on: ubuntu-latest
    # 20, not 5. The crap-lint step runs the changed packages' tests to measure
    # coverage, which can take minutes. At 5 the runner would cancel the whole
    # job mid-measurement, and a cancelled job skips the comment steps entirely,
    # so the step's continue-on-error would not preserve the advisory behavior.
    # crap-lint bounds its own coverage run well inside this budget.
    timeout-minutes: 20
    outputs:
      should_comment: ${{ steps.scope.outputs.should_comment }}
      mixed_concern: ${{ steps.concern.outputs.mixed_concern }}
      crap_flagged: ${{ steps.crap.outputs.crap_flagged }}
      crap_unknown: ${{ steps.crap.outputs.crap_unknown }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The PR head itself, not the default merge commit. The crap-lint
          # step measures coverage by running the changed packages' tests
          # against the checkout, and it refuses to score at all when the
          # checkout is not the head revision, so on the merge commit it would
          # silently measure nothing. The scope and concern steps below are
          # unaffected: they name base and head as explicit revisions and never
          # read the working tree.
          #
          # Checking out PR head code is safe here because this job holds no
          # secret beyond the default GITHUB_TOKEN and never runs on
          # pull_request_target. The tests it runs are the PR's own, which the
          # ordinary CI workflow already runs on the same code.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compute PR scope
        id: scope
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags origin "$base" || true
          git cat-file -e "$head^{commit}" 2>/dev/null || git fetch --no-tags origin "$head" || true

          git diff --numstat "$base"..."$head" > /tmp/numstat.txt
          # ACMRDT: Added/Copied/Modified/Renamed/Deleted/Type-changed. T
          # covers e.g. a regular file replaced by a symlink — omitting it
          # let such files vanish from both changed_files and top_level_areas.
          #
          # --name-status (not --name-only) so renames/copies report BOTH the
          # source and destination path. A cross-area rename (agm/x.go ->
          # pkg/x.go) touches two top-level areas, and reviewing it means
          # reading both; --name-only reports only the destination and so
          # undercounts exactly the sprawling moves this gate exists to catch.
          # -z, because Git's default output quotes and backslash-escapes any
          # pathname with non-ASCII bytes. `docs/café.md` would arrive as
          # "docs/caf\303\251.md" and parse under the area `"docs`, reporting
          # two areas for one directory and posting a false warning. With -z
          # pathnames are emitted verbatim.
          #
          # In -z mode --name-status emits STATUS\0path\0, except rename and
          # copy records, which emit STATUS\0source\0dest\0. Read the records
          # explicitly so both halves of a rename are available.
          git diff -z --name-status --diff-filter=ACMRDT "$base"..."$head" \
            > /tmp/namestatus.z

          changed_files=0
          : > /tmp/areas.txt
          # A rename is ONE file change but TWO areas: reviewing agm/x.go ->
          # pkg/x.go means reading both trees, while counting it as two files
          # would make 25 ordinary renames trip the 50-file threshold. So the
          # record is counted once and every pathname it carries feeds areas.
          record_area() {
            case "$1" in
              .github/*) printf '%s\n' "$(printf '%s' "$1" | cut -d/ -f1-2)" >> /tmp/areas.txt ;;
              */*)       printf '%s\n' "${1%%/*}" >> /tmp/areas.txt ;;
              *)         printf '%s\n' "$1" >> /tmp/areas.txt ;;
            esac
          }

          # `rec`, not `status`: `status` is a read-only special variable in
          # some shells, which turns this loop into a hard error there.
          while IFS= read -r -d '' rec; do
            case "$rec" in
              R*|C*)
                IFS= read -r -d '' src || break
                IFS= read -r -d '' dst || break
                record_area "$src"
                record_area "$dst"
                ;;
              *)
                IFS= read -r -d '' path || break
                record_area "$path"
                ;;
            esac
            changed_files=$((changed_files + 1))
          done < /tmp/namestatus.z

          changed_lines=$(awk '{ add += $1 == "-" ? 0 : $1; del += $2 == "-" ? 0 : $2 } END { print add + del + 0 }' /tmp/numstat.txt)
          top_level_areas=$(sort -u /tmp/areas.txt | grep -c . || true)

          reasons=()
          if [ "$changed_lines" -gt "$MAX_CHANGED_LINES" ]; then
            reasons+=("- ${changed_lines} changed lines exceeds the ${MAX_CHANGED_LINES}-line review threshold.")
          fi
          if [ "$changed_files" -ge "$MAX_CHANGED_FILES" ]; then
            reasons+=("- ${changed_files} changed files meets or exceeds the ${MAX_CHANGED_FILES}-file scope threshold.")
          fi
          if [ "$top_level_areas" -ge "$MAX_TOP_LEVEL_AREAS" ]; then
            reasons+=("- ${top_level_areas} top-level areas meets or exceeds the ${MAX_TOP_LEVEL_AREAS}-area scope threshold.")
          fi

          {
            echo "changed_lines=$changed_lines"
            echo "changed_files=$changed_files"
            echo "top_level_areas=$top_level_areas"
            if [ "${#reasons[@]}" -gt 0 ]; then
              echo "should_comment=true"
              echo "reasons<<EOF"
              printf '%s\n' "${reasons[@]}"
              echo "EOF"
            else
              echo "should_comment=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Shape, not size. The thresholds above cannot see a small PR that
      # renames a source file AND builds new logic on the new names — the exact
      # split CONTRIBUTING.md asks for. This reports that mix on its own.
      # Advisory by construction: the command exits 0 either way, so it can
      # never become the reason a PR cannot merge.
      - name: Detect mixed refactor and new logic
        id: concern
        run: |
          go run ./tools/pr-concern-lint \
            -base "${{ github.event.pull_request.base.sha }}" \
            -head "${{ github.event.pull_request.head.sha }}" \
            -min-new-logic "$MIN_NEW_LOGIC_LINES" \
            -github-output >> "$GITHUB_OUTPUT"

      # Neither threshold above can see complexity that no test exercises. A
      # 40-line diff can add a branchy function to a package whose tests build
      # the binary and exec it, which reads as 0% covered while the zero-test
      # scan in cmd/structural-health sees test files and stays quiet. This
      # step joins gocyclo-equivalent complexity with go cover on the changed
      # functions and reports the join.
      #
      # It deliberately does not re-check discarded error returns or raw
      # complexity: errcheck and gocyclo already own those in .golangci.yml,
      # already diff-scoped via new-from-merge-base, and already hard-gating.
      #
      # Advisory by construction: the command exits 0 either way, so it can
      # never become the reason a PR cannot merge. It runs the changed
      # packages' tests to measure coverage, so it is bounded and allowed to
      # fail without failing the job.
      # CRAPLENS-05 claims the lens counts complexity the same way the gocyclo
      # that golangci-lint runs does. That claim is checked against the real
      # binary by TestComplexityParityWithGocycloBinary, which SKIPS when
      # gocyclo is absent — so without this step the claim could drift with no
      # test failing anywhere. Pinned rather than @latest so a gocyclo release
      # cannot silently change what parity means.
      - name: Install gocyclo for the parity check
        run: go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0

      - name: Verify complexity parity with gocyclo
        run: |
          # The default shell here is `bash -e {0}`, which does not imply
          # pipefail: without it, a failing `go test` is masked by `tee`'s
          # own success, so this step would go green on the exact test
          # failure it exists to catch. set -o pipefail makes the pipeline's
          # exit status the test's, so -e can still stop the step on it.
          set -o pipefail
          go test ./internal/craplens/ -run TestComplexityParityWithGocycloBinary -count=1 -v 2>&1 | tee /tmp/parity.log
          if grep -q -- "--- SKIP" /tmp/parity.log; then
            echo "::error::the gocyclo parity check skipped; CRAPLENS-05 was not verified"
            exit 1
          fi
          # A renamed or deleted test leaves -run matching nothing: go test
          # still exits 0 and prints no SKIP marker, so the check above alone
          # would go green without ever running CRAPLENS-05's verification.
          # Require the exact PASS record instead of trusting the exit code.
          if ! grep -qF -- "--- PASS: TestComplexityParityWithGocycloBinary" /tmp/parity.log; then
            echo "::error::TestComplexityParityWithGocycloBinary did not run (renamed, deleted, or -run matched nothing); CRAPLENS-05 was not verified"
            exit 1
          fi

      - name: Score changed functions for complexity against coverage
        id: crap
        if: '!cancelled()'
        continue-on-error: true
        env:
          CI: "true"
          CI_SKIP_TMUX: "true"
          # The repository's CI contract is the single root module. Without
          # this, a PR that adds a go.work file would have that
          # candidate-controlled workspace auto-enabled for both the go run
          # and the coverage tests, so the lens would measure a different
          # package and dependency set than every other gate.
          GOWORK: "off"
        run: |
          go run ./tools/crap-lint \
            -base "${{ github.event.pull_request.base.sha }}" \
            -head "${{ github.event.pull_request.head.sha }}" \
            -github-output >> "$GITHUB_OUTPUT"

      - name: Update PR size, scope, and code-health comment
        # tools/pr-size-comment now returns a distinct non-zero status when a
        # gh operation it depends on fails, instead of always returning 0 —
        # so this step can genuinely fail for the first time. continue-on-error
        # keeps that advisory (a lost comment update never blocks the merge,
        # this step isn't in the required-checks list), but the step itself
        # still shows red in the run: that visible failure is exactly the
        # signal this fix exists to expose, where before there was none.
        continue-on-error: true
        # A pull_request run from a fork, or one opened by Dependabot (whose
        # workflow runs also get a read-only GITHUB_TOKEN even though the head
        # branch lives in this repo), can't post/delete comments; skip rather
        # than error out.
        #
        # Gate on the PR *author*, not github.actor: actor is whoever triggered
        # this particular run, so a human pushing to (or reopening) a Dependabot
        # PR flips actor to that human while the token stays read-only — the
        # step would then run and fail. The author is stable across every event
        # on the PR.
        #
        # The decision (update the comment, delete a stale one, or do
        # nothing), the prior-section recovery across a crap run that could
        # not re-measure, and the comment body itself all live in
        # tools/pr-size-comment now: this used to be two bash steps, and the
        # second one had grown well past what a workflow step should carry —
        # API reads, prior-section recovery, rendering, and patch/create/
        # dedupe selection.
        #
        # !cancelled(), not the bare expression: an `if:` with no status
        # function implies success(), so a failure in "Install gocyclo" or
        # "Verify complexity parity" — upstream of this step, neither
        # continue-on-error — would skip this step entirely despite its own
        # continue-on-error, silently losing the already-computed size and
        # mixed-concern results and leaving the sticky comment unable to
        # recover or self-correct on the next push.
        if: (!cancelled()) && (!github.event.pull_request.head.repo.fork) && github.event.pull_request.user.login != 'dependabot[bot]'
        # Every value below arrives via env, not interpolated directly into
        # this script: several (CRAP_REPORT, REASONS, a diff-derived file
        # path in TOP_LEVEL_AREAS) come from repository content a PR author
        # controls, and splicing "${{ ... }}" straight into a run: block is
        # the classic Actions script-injection shape. An env var's value is
        # never re-parsed as shell syntax, no matter what it contains.
        #
        # Security: this step runs with a write-scoped GH_TOKEN (issues:
        # write, pull-requests: write). The checkout above is the PR's own
        # HEAD, so for a same-repository PR (not just a fork — the fork
        # guard above does not cover this) the PR author can modify
        # tools/pr-size-comment itself. `go run ./tools/pr-size-comment`
        # would then compile and execute that candidate-controlled code
        # with this job's write token in its environment, letting a
        # crafted PR perform arbitrary GitHub API calls as this workflow.
        # Build the binary from the PR's BASE revision instead — code
        # already on the protected branch, never the candidate — so no
        # PR-controlled code ever runs with GH_TOKEN present. A PR that
        # introduces or changes this tool (like this one) has no trusted
        # prior copy to build from yet; skip posting rather than fall back
        # to the untrusted head in that case; the workflow behaves normally
        # again on every PR after this one merges.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHOULD_COMMENT: ${{ steps.scope.outputs.should_comment }}
          MIXED_CONCERN: ${{ steps.concern.outputs.mixed_concern }}
          CRAP_FLAGGED: ${{ steps.crap.outputs.crap_flagged }}
          CRAP_UNKNOWN: ${{ steps.crap.outputs.crap_unknown }}
          CRAP_OUTCOME: ${{ steps.crap.outcome }}
          CHANGED_LINES: ${{ steps.scope.outputs.changed_lines }}
          CHANGED_FILES: ${{ steps.scope.outputs.changed_files }}
          TOP_LEVEL_AREAS: ${{ steps.scope.outputs.top_level_areas }}
          REASONS: ${{ steps.scope.outputs.reasons }}
          CONCERN_REASON: ${{ steps.concern.outputs.reason }}
          CRAP_REPORT: ${{ steps.crap.outputs.crap_report }}
          CRAP_SUMMARY: ${{ steps.crap.outputs.crap_summary }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          CONCERN_OUTCOME: ${{ steps.concern.outcome }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          trusted_dir=$(mktemp -d)
          git worktree add --detach --quiet "$trusted_dir" "$BASE_SHA"
          if [ ! -f "$trusted_dir/tools/pr-size-comment/main.go" ]; then
            echo "::notice::tools/pr-size-comment does not exist at this PR's base revision yet; skipping the comment update rather than building candidate-controlled code with a write-scoped token."
            exit 0
          fi
          go build -C "$trusted_dir" -o /tmp/pr-size-comment ./tools/pr-size-comment
          /tmp/pr-size-comment \
            -repo "$REPO" \
            -pr "$PR_NUMBER" \
            -should-comment="$SHOULD_COMMENT" \
            -mixed-concern="$MIXED_CONCERN" \
            -crap-flagged="$CRAP_FLAGGED" \
            -crap-unknown="$CRAP_UNKNOWN" \
            -crap-outcome="$CRAP_OUTCOME" \
            -changed-lines="$CHANGED_LINES" \
            -changed-files="$CHANGED_FILES" \
            -top-level-areas="$TOP_LEVEL_AREAS" \
            -reasons="$REASONS" \
            -concern-reason="$CONCERN_REASON" \
            -crap-report="$CRAP_REPORT" \
            -crap-summary="$CRAP_SUMMARY" \
            -scope-outcome="$SCOPE_OUTCOME" \
            -concern-outcome="$CONCERN_OUTCOME"

  # ---------------------------------------------------------------------------
  # The deterministic job above states THAT a PR is too big. It cannot say what
  # to do about it, and two days of evidence say a bare threshold report changes
  # nothing: every oversized PR merged after that job shipped got its comment and
  # merged unsplit anyway (5 of 5 — see the 2026-08-19 retro).
  #
  # This job answers the question the comment left open: given THIS diff, where
  # are the seams? It runs ONLY when the deterministic gate already tripped, so
  # the model is never spent on a PR that is within budget, and its verdict is
  # advisory — the job cannot fail the check, because size is explicitly not a
  # REVIEW.md §3 blocking trigger.
  #
  # It is also allowed to conclude the change is genuinely atomic. That is the
  # point: declining to split should be a stated, recorded reason rather than
  # silence.
  # ---------------------------------------------------------------------------
  split-request:
    name: Split request
    needs: size-scope
    if: |
      always() && needs.size-scope.result != 'cancelled' &&
      (needs.size-scope.outputs.should_comment == 'true' ||
       needs.size-scope.outputs.mixed_concern == 'true') &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ask for a concrete split
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            PR ${{ github.repository }}#${{ github.event.pull_request.number }} tripped the
            deterministic size/scope gate. Read its diff and propose how to break it up.

            The repository budget is at most 400 changed lines and at most 15 changed files
            per PR; CONTRIBUTING.md section "Small, stacked PRs" and the .claude/skills/split-prs
            skill hold the full rule. The CI thresholds are ceilings, not targets.

            Produce ONE of two verdicts.

            SPLITTABLE — the normal case. Propose a concrete stacked series in the required
            order: mechanical (renames, moves, generated output, formatting) first, then the
            enabling refactor (new seams, extracted interfaces, signature changes, no behavior
            change), then behavior last. For each proposed PR give a title, the specific files
            or hunks it carries, and a rough changed-line count. Name real paths from this
            diff, never placeholders. Say explicitly that each step must land on main before
            the next opens, so every PR gets the five-dimension review.

            Frame the proposal so THIS pull request stays as the TIP of the stack. The lower
            slices are extracted into new PRs beneath it, and this PR is retargeted onto the
            topmost slice — it is never closed and replaced by a fresh PR for the remainder.

            Prescribe GitHub's native stacking, and give the exact commands. Pointing each
            base at the branch below builds a valid chain, but a chain is not a registered
            stack: `gh stack sync` only cascade-rebases members of a registered stack, and it
            is what switches to `--onto` automatically once a lower PR merges. So the proposal
            must end with the registration step, tip LAST, and must reuse this PR number:
              gh extension install github/gh-stack   # once per machine
              gh stack link <slice-1-branch> <slice-2-branch> <this-branch>
              gh stack sync                          # after anything lands beneath it
            `gh stack link` accepts PR numbers and reuses the open PR on a branch, so this PR
            keeps its number, threads, and CI history by construction. Do not propose
            `git rebase --onto` with `gh pr edit --base`; that hand-rolled recipe is
            superseded.

            Never propose closing this PR and opening a new top PR: an open PR carries the
            review threads, bot findings, and CI history that a later retrospective reads to
            reconstruct the decision, and closing it discards that while git keeps the code
            either way. Closing is correct only if the slices absorb the change completely and
            nothing remains at the tip; say that only when it is true, and say which PRs would
            supersede it.

            ATOMIC — only when the change genuinely cannot be split: a mechanical rename across
            many call sites, a generated-file refresh, a vendored dependency update, or a change
            where any smaller step would leave main broken. State which of those it is and why.
            "It was all one task" and "the parts are related" are NOT atomic; discovering two
            problems in one session does not make them one change. If you claim ATOMIC, say
            whether the mechanical bulk is at least isolated in its own commit so a reviewer can
            skip it.

            Be specific and short. No preamble, no restating the diff back.

            Then post your verdict as a single PR comment whose FIRST line is exactly the
            marker `<!-- pr-split-request -->`. Before posting, list existing comments and if
            one already starts with that marker, EDIT it in place instead of adding another
            (`gh api --method PATCH repos/OWNER/REPO/issues/comments/ID`). Editing notifies
            nobody; re-posting on every push trains people to mute the thread, which is how the
            deterministic comment came to be ignored.
