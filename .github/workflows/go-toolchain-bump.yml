name: Go toolchain bump

# Weekly check: if the stable Go toolchain version is newer than the `go`
# directive in go.mod, open a PR that bumps it.  Implements CI-cascade retro
# 2026-05-09 fix #3 (bead ce-6as.47).

on:
  schedule:
    - cron: "0 10 * * 1"   # Mondays 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GIT_TERMINAL_PROMPT: "0"

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Resolve latest stable Go version
        id: latest
        run: |
          set -euo pipefail
          # dl.google.com/go returns the latest stable release page; parse it.
          LATEST=$(curl -fsSL "https://go.dev/VERSION?m=text" | head -1 | sed 's/^go//')
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest Go: $LATEST"

      - name: Read current go directive
        id: current
        run: |
          set -euo pipefail
          CURRENT=$(grep -E '^go ' go.mod | awk '{print $2}')
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current go directive: $CURRENT"

      - name: Check if bump is needed
        id: diff
        run: |
          if [ "${{ steps.latest.outputs.version }}" = "${{ steps.current.outputs.version }}" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go ${{ steps.latest.outputs.version }}
        if: steps.diff.outputs.needed == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.latest.outputs.version }}

      - name: Bump go directive and tidy
        if: steps.diff.outputs.needed == 'true'
        run: |
          set -euo pipefail
          go mod edit -go="${{ steps.latest.outputs.version }}"
          go mod tidy

      - name: Open PR
        if: steps.diff.outputs.needed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "auto/go-bump-${{ steps.latest.outputs.version }}"
          commit-message: "chore(go): bump go directive to ${{ steps.latest.outputs.version }}"
          title: "chore(go): bump go directive ${{ steps.current.outputs.version }} → ${{ steps.latest.outputs.version }}"
          body: |
            Auto-generated by the `go-toolchain-bump` workflow.

            Bumps the `go` directive in `go.mod` from `${{ steps.current.outputs.version }}`
            to `${{ steps.latest.outputs.version }}` and runs `go mod tidy`.

            This keeps the toolchain declaration current and avoids the drift that caused
            the CI cascade in the 2026-05-09 retro (bead ce-6as.47).
          labels: "dependencies,go"
          delete-branch: true
