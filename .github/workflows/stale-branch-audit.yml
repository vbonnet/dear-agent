name: Stale Branch Audit

# Weekly audit of agent branches that have not been merged or updated in
# more than STALE_DAYS days. Unmerged branches with no associated open PR
# are potential orphaned worktrees — the local worktree was abandoned
# without running the cleanup steps (agm worktree sweep).
#
# Opens a rolling GitHub issue when orphans are found; auto-closes when clean.
# This is a visibility job, not a merge gate.
#
# Cadence mirrors the weekly tier:
#   daily:   branch-protection-audit.yml
#   weekly:  health-check.yml, dependency-freshness.yml, this file
#   monthly: monthly-audit.yml

on:
  schedule:
    # Fridays 08:00 UTC — run after the weekly health-check (Mon 14:00)
    # so orphan reports land at a natural weekly review point.
    - cron: "0 8 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GIT_TERMINAL_PROMPT: "0"
  # Branches not pushed or PRed within this many days are flagged.
  STALE_DAYS: "14"
  # Only branches matching this prefix are inspected (agent work branches).
  BRANCH_PREFIX: "feat/"

jobs:
  audit:
    name: Stale branch audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find stale agent branches
        id: stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff=$(date -d "${STALE_DAYS} days ago" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
            || date -v-${STALE_DAYS}d '+%Y-%m-%dT%H:%M:%SZ')

          findings=""

          # List all branches whose last push predates the cutoff.
          # gh api --paginate returns all pages; jq filters to our prefix.
          while IFS= read -r line; do
            branch=$(echo "$line" | jq -r '.name')
            pushed=$(echo "$line" | jq -r '.commit.commit.committer.date // empty')
            [ -z "$pushed" ] && continue

            # Only inspect agent work branches.
            case "$branch" in
              ${BRANCH_PREFIX}*) ;;
              *) continue ;;
            esac

            # Skip branches more recent than the cutoff.
            if [[ "$pushed" > "$cutoff" ]]; then
              continue
            fi

            # Check if this branch has an open PR.
            pr_count=$(timeout 15 gh pr list \
              --repo "$REPO" \
              --head "$branch" \
              --state open \
              --json number \
              --jq 'length')

            if [ "${pr_count:-0}" -eq 0 ]; then
              findings="${findings}\n- \`${branch}\` — last push ${pushed} (no open PR)"
            fi
          done < <(timeout 30 gh api --paginate \
            "repos/${REPO}/branches" \
            --jq '.[]')

          {
            echo "stale_branches<<__EOF__"
            printf '%b\n' "$findings"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

          if [ -n "$findings" ]; then
            echo "has_stale=true" >> "$GITHUB_OUTPUT"
            echo "Stale agent branches found:"
            printf '%b\n' "$findings"
          else
            echo "has_stale=false" >> "$GITHUB_OUTPUT"
            echo "ok: no stale agent branches (>${STALE_DAYS}d, no open PR)"
          fi

      - name: Build summary
        run: |
          {
            echo "## Stale Branch Audit — $(date -u '+%Y-%m-%d')"
            echo ""
            echo "Branches matching \`${BRANCH_PREFIX}*\` with no open PR, not pushed in ${STALE_DAYS}+ days."
            echo "These are likely orphaned worktrees — run \`agm worktree sweep\` locally to triage."
            echo ""
            if [ -n "${stale_branches:-}" ]; then
              printf '%b\n' "${stale_branches:-}"
            else
              echo "✓ No stale agent branches"
            fi
          } | tee stale-branch-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stale-branch-report
          path: stale-branch-report.md
          retention-days: 30

      - name: Open / update stale-branch issue on findings
        if: steps.stale.outputs.has_stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="stale-branch-audit: orphaned agent branches $(date -u '+%Y-%m')"
          body=$(cat stale-branch-report.md)
          existing=$(timeout 30 gh issue list \
            --repo "$REPO" \
            --label stale-branch-audit \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            timeout 30 gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            timeout 30 gh issue create \
              --repo "$REPO" \
              --title "$title" \
              --body "$body" \
              --label stale-branch-audit
          fi

      - name: Auto-close stale-branch issue when clean
        if: steps.stale.outputs.has_stale == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(timeout 30 gh issue list \
            --repo "$REPO" \
            --label stale-branch-audit \
            --state open \
            --json number \
            --jq '.[].number')
          for n in $existing; do
            timeout 30 gh issue close "$n" --repo "$REPO" \
              --comment "Stale-branch audit: no orphaned branches found; auto-closing."
          done
