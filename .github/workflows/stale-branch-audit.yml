name: Stale Branch Audit

# Weekly branch hygiene pass, powered by cmd/branch-reaper:
#
#   1. Auto-deletes branches whose tip is still the exact commit their merged
#      PR carried into main -- GitHub's own "delete head branches on merge"
#      setting is on but silently misses ~1.4% of merges for no discernible
#      reason, and nothing ever retries those. This step is that retry, and it
#      is provably safe: the branch's content is already in main's history via
#      the squash commit, so deleting the ref loses nothing.
#   2. Reports (never deletes) branches that never had a PR, had a PR closed
#      without merging, or whose tip moved off the merged head -- those need a
#      human judgment call, not automation. Branches whose PR history could
#      not even be looked up (gh auth/rate-limit/API error) get their own
#      report bucket too, rather than being silently misread as "no PR".
#
# Cadence mirrors the weekly tier:
#   daily:   branch-protection-audit.yml
#   weekly:  health-check.yml, dependency-freshness.yml, this file
#   monthly: monthly-audit.yml

on:
  schedule:
    # Fridays 08:00 UTC — run after the weekly health-check (Mon 14:00)
    # so branch reports land at a natural weekly review point.
    - cron: "0 8 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  GIT_TERMINAL_PROMPT: "0"

jobs:
  audit:
    name: Branch reaper
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch all remote branches
        # actions/checkout only wires up refs for the triggering ref by
        # default even with fetch-depth: 0 -- the reaper needs every branch's
        # tip commit SHA, so fetch the full refs/heads/* namespace.
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build branch reaper
        # Built, not `go run`: `go run` reports a compile failure as exit 1,
        # which is also the reaper's "review list is non-empty" signal. A
        # separate build step keeps the two apart, so a broken build fails
        # here instead of quietly opening a review issue.
        run: go build -o "${RUNNER_TEMP}/branch-reaper" ./cmd/branch-reaper

      - name: Run branch reaper (auto-delete safe set, report the rest)
        id: reaper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          "${RUNNER_TEMP}/branch-reaper" --json --execute > reaper-report.json
          reaper_rc=$?
          # 0 = clean, 1 = review list non-empty, 2 = a PR-history lookup
          # failed for one or more branches (skipped, see lookup_failed),
          # 4 = a safe delete was rejected. Only 3 (usage/environment error)
          # means no report was produced at all -- everything else still has
          # a valid JSON report on stdout worth surfacing to a human.
          if [ "$reaper_rc" -eq 3 ]; then
            echo "::error::branch-reaper exited $reaper_rc (usage/environment error, no report produced)" >&2
            exit "$reaper_rc"
          fi
          if [ "$reaper_rc" -eq 2 ]; then
            echo "::warning::branch-reaper could not retrieve PR history for one or more branches -- see lookup_failed in the report" >&2
          fi
          if [ "$reaper_rc" -eq 4 ]; then
            echo "::warning::branch-reaper failed to delete one or more safe_delete branches -- see the job logs above" >&2
          fi

          {
            echo "## Branch audit — $(date -u '+%Y-%m-%d')"
            echo
            echo "### Auto-deleted this run (merged, tip still the merged head)"
            jq -r '.safe_delete[]? | "- `\(.)`"' reaper-report.json
            echo
            echo "### Never had a PR — review for abandoned work"
            jq -r '.review_no_pr[]? | "- `\(.)`"' reaper-report.json
            echo
            echo "### PR closed without merging — may be deliberate, review before deleting"
            jq -r '.review_closed_unmerged[]? | "- `\(.)`"' reaper-report.json
            echo
            echo "### Merged, but tip moved off the merged head — unmerged follow-up work"
            jq -r '.review_new_commits_after_merge[]? | "- `\(.)`"' reaper-report.json
            echo
            echo "### Could not check PR history — gh lookup failed, review manually"
            jq -r '.lookup_failed[]? | "- `\(.)`"' reaper-report.json
          } > stale-branch-report.md

          if [ "$reaper_rc" -ge 1 ]; then
            echo "has_review=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_review=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build summary
        run: |
          cat stale-branch-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stale-branch-report
          path: |
            stale-branch-report.md
            reaper-report.json
          retention-days: 30

      - name: Open / update review-needed issue
        if: steps.reaper.outputs.has_review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="stale-branch-audit: branches needing review $(date -u '+%Y-%m')"
          body=$(cat stale-branch-report.md)
          existing=$(timeout 30 gh issue list \
            --repo "$REPO" \
            --label stale-branch-audit \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            timeout 30 gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            timeout 30 gh issue create \
              --repo "$REPO" \
              --title "$title" \
              --body "$body" \
              --label stale-branch-audit
          fi

      - name: Auto-close review-needed issue when clean
        if: steps.reaper.outputs.has_review == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(timeout 30 gh issue list \
            --repo "$REPO" \
            --label stale-branch-audit \
            --state open \
            --json number \
            --jq '.[].number')
          for n in $existing; do
            timeout 30 gh issue close "$n" --repo "$REPO" \
              --comment "Branch audit: nothing left needing review; auto-closing."
          done
