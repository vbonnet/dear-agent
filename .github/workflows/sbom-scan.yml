name: SBOM and Security Scan

on:
  push:
    branches: [main]
    paths:
      - go.sum
      - go.mod
      - "**/go.sum"
      - "**/go.mod"
      - "**/*.lock"
      - "**/package.json"
  pull_request:
    # Keep this workflow triggered for every PR because the repository ruleset
    # requires the "Vulnerability Scan" context. The expensive jobs skip below
    # on pull_request, so this emits the required context without running Trivy.
    branches: [main]
  release:
    types: [created]
  schedule:
    # Weekly scan on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  changes:
    name: Change Detection
    uses: ./.github/workflows/changed-paths.yml

  sbom-generation:
    name: Generate SBOM
    # SBOM artifacts are consumed for release/compliance, not per-PR review.
    # Skip on pull_request to save a Trivy run on every PR; still generated
    # on push to main, on release, and on the weekly schedule.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy to generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: 'sbom-cyclonedx.json'

      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          format: 'spdx-json'
          output: 'sbom-spdx.json'

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-reports
          path: |
            sbom-cyclonedx.json
            sbom-spdx.json
          retention-days: 90

  # DIFF-SCOPED ENFORCEMENT. This job produces the required "Vulnerability Scan"
  # context, so it must keep reporting on every PR — but what it *blocks* on is
  # now scoped to what the PR changed.
  #
  # The problem it fixes: Trivy scans the whole tree against a live advisory
  # database. The moment a CRITICAL is published against a dependency nobody
  # touched, this job goes red on every open PR simultaneously and the whole
  # repo is unmergeable until someone bumps the dep — pre-existing debt blocking
  # unrelated work, the exact failure mode ce-lz9ny hit with govulncheck.
  #
  # The scoping: a PR that changes no dependency manifest or lockfile cannot
  # introduce a dependency vulnerability. Such a PR gets the advisory scan
  # (findings still land in the Security tab) but is not blocked by it. A PR
  # that DOES touch go.mod / go.sum / package.json / *.lock is gated exactly as
  # strictly as before — this weakens nothing for the changes that can actually
  # cause the failure.
  #
  # The catch, stated plainly: this is manifest-scoping, not true baseline
  # diffing — Trivy has no --baseline-commit. A PR that bumps one dependency is
  # still blocked by an unrelated pre-existing CRITICAL elsewhere in the tree.
  # Closing that gap needs a checked-in baseline; tracked separately. What
  # catches the debt in the meantime is the unchanged full blocking scan on
  # push-to-main, on release, and on the weekly schedule, plus the main-health
  # watchdog that files a retro when main goes red.
  vulnerability-scan:
    name: Vulnerability Scan
    needs: changes
    # `!cancelled()` is load-bearing. This job produces a REQUIRED context, and
    # an `if:` with no status function — or no `if:` at all next to a `needs:` —
    # inherits an implicit `success()`. A detector that fails on checkout or
    # runner startup would then skip this job, and a skipped required check
    # satisfies branch protection exactly as well as a passing one, so the
    # security gate would vanish rather than turn red. See ADR-038.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # Blocking pass. Runs unconditionally off pull_request (push to main,
      # release, weekly schedule), on any PR that touches a dependency manifest
      # or lockfile, and on any PR where the detector did not succeed — an
      # unknowable change set means "scan", never "skip".
      - name: Run Trivy with exit code
        if: >-
          ${{ github.event_name != 'pull_request'
          || needs.changes.result != 'success'
          || needs.changes.outputs.deps == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Explain non-blocking pass
        if: >-
          ${{ github.event_name == 'pull_request'
          && needs.changes.result == 'success'
          && needs.changes.outputs.deps != 'true' }}
        run: |
          echo "::notice ::Vulnerability Scan is advisory for this PR: no dependency"
          echo "::notice ::manifest or lockfile changed, so it cannot introduce a new"
          echo "::notice ::dependency vulnerability. Findings above are recorded in the"
          echo "::notice ::Security tab. The full blocking scan runs on push to main,"
          echo "::notice ::on release, and weekly."

  go-vulnerability-check:
    name: Go Vulnerability Check
    # On pull_request this is fully redundant with the required `govulncheck`
    # job in ci.yml (identical -scan package invocation + allowlist). Run it
    # only off-PR so the weekly schedule still catches vulns disclosed against
    # unchanged dependencies, without paying for a third govulncheck per PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      # `-scan package` instead of default `-scan symbol`: the latter
      # builds SSA and panics inside golang.org/x/tools v0.44.0 lift on
      # tailscale.com's generic-heavy code paths. Package mode skips
      # SSA but flags any vulnerable package in the import graph,
      # including transitive ones we don't actually call. The jq pass
      # filters known-not-called false positives by GO ID.
      #
      # Allowlist (review on every dep bump):
      #   GO-2025-3884 — github.com/gorilla/csrf TrustedOrigins.
      #     Pulled in via tailscale.com/client/web. Fixed in: N/A.
      #     Our code never invokes csrf.Protect / TrustedOrigins.
      - name: Run govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -format json -scan package ./... > vulncheck.json
          unhandled=$(jq -c \
            --argjson allow '["GO-2025-3884", "GO-2026-5932"]' \
            'select(.finding != null)
             | select(.finding.osv as $id | $allow | index($id) | not)
             | .finding' \
            vulncheck.json)
          if [ -n "$unhandled" ]; then
            echo "Unallowed vulnerabilities found:"
            echo "$unhandled"
            exit 1
          fi
          echo "No unallowed vulnerabilities."
