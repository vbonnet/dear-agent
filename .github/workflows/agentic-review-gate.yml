name: Agentic Review Gate

# The merge-blocking half of the per-family agentic review gate.
#
# Each reviewer family publishes its own lifecycle as labels — started before
# its model is invoked, posted once its review body lands, then a verdict — and
# this workflow collapses those labels into the required check. The policy
# (families, quorum, timeouts) lives in .github/agentic-review.yml; the
# evaluation lives in cmd/agentic-review-gate.
#
# No model runs here, by design. The reviewers are the expensive, quota-limited,
# occasionally-down part of the system, so nothing in the merge-blocking path is
# allowed to depend on one of them answering. This workflow reads three cheap
# GitHub endpoints and a config file. A quota incident degrades the review while
# leaving intact the ability to decide whether a review happened.
#
# The gate job's name IS the required context, per the repository invariant that
# every required check is produced by a job (see
# cmd/changed-paths/workflow_contract_test.go). That constraint is what shapes
# the waiting below: a reviewer family that falls silent past its deadline
# transitions from pending to down on a clock, emitting no GitHub event, so
# there would be nothing left to re-trigger a check that had already reported.
# Rather than leave the check stranded red, the job waits out that deadline
# itself and re-evaluates.
#
# Fork pull requests get a read-only token and cannot publish labels, so the
# gate stays red for them. That matches the existing reviewer workflows, which
# already decline to run against fork heads.

on:
  pull_request:
    # labeled/unlabeled are what advance the gate: a reviewer publishing its
    # verdict is a label event and nothing else, so without them the check
    # would only ever reflect the state at push time.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  merge_group:
  workflow_dispatch:

# Deny-all floor; each job declares the scopes it needs.
permissions: {}

concurrency:
  group: agentic-review-gate-${{ github.event.pull_request.number || github.ref }}
  # A newer event supersedes a waiting evaluation: the label that arrives while
  # this job is waiting is exactly the thing it was waiting for.
  cancel-in-progress: true

jobs:
  invalidate:
    # A push invalidates every verdict on the old head. Clearing the labels is
    # what makes "bound to the head SHA" true rather than aspirational: without
    # it an approval of the previous diff would still be sitting on the pull
    # request, and the gate reads labels.
    name: Invalidate stale review labels
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove every agentic review label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json labels \
            --jq '.labels[].name | select(startswith("agentic-review:"))' > stale.txt
          while read -r label; do
            [[ -n "$label" ]] || continue
            gh pr edit "$PR" --repo "$REPO" --remove-label "$label"
            echo "cleared $label"
          done < stale.txt

  gate:
    # This job's name is the required status-check context.
    name: Agentic Review Gate
    needs: [invalidate]
    # Always runs so the context always reports. The invalidate result is
    # checked inside rather than in this `if:`, because a job that never runs
    # reports nothing at all and a merge must not proceed on a gate that
    # stayed silent.
    if: always()
    runs-on: ubuntu-latest
    # Above the largest deadline in .github/agentic-review.yml, so the job can
    # outlast a reviewer that has to be aged out rather than reporting red
    # while the answer is still coming.
    timeout-minutes: 55
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require a successful invalidation
        env:
          RESULT: ${{ needs.invalidate.result }}
        run: |
          set -euo pipefail
          if [[ "$RESULT" != "success" && "$RESULT" != "skipped" ]]; then
            echo "::error::label invalidation reported '$RESULT'; stale approvals may survive"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Evaluate the agentic review quorum
        if: github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # Exit 3 means the lifecycle has not resolved. Only that is worth
          # waiting on: a pass and a rejection are both final answers.
          while true; do
            go run ./cmd/agentic-review-gate --repo "$REPO" --pr "$PR"
            code=$?
            [[ "$code" -eq 3 ]] || exit "$code"
            echo "review lifecycle unresolved; re-evaluating in 60s"
            sleep 60
          done
