name: AI Code Review (5-dimension)

# Five-dimension multi-persona review per REVIEW.md §2. The review logic lives
# in cmd/ai-review (Go); this workflow is a thin wrapper whose job exit status
# is the enforcement signal.
#
# Fail-closed contract (see cmd/ai-review), in force whenever the gate runs:
#   - only an "approved" outcome (or the audited 'ai-review:override' label)
#     exits 0; needs-work / rejected / needs-human-review fail this workflow.
#   - fork PRs, per-dimension API failure, synthesis failure, unparseable
#     outcome, and oversize diffs all fail closed. (A missing secret also fails
#     closed inside cmd/ai-review. While no reviewer credential is configured,
#     an authenticated plan with neither SPEC-governance work nor a deterministic
#     REVIEW.md §3 escalation may take this workflow's explicit neutral path
#     before command invocation.)
#
# Runs on every PR revision (opened/synchronize/reopened/ready_for_review), not
# just the draft->ready edge, so the check that gates the current head SHA
# actually reflects the current head SHA.
#
# SPEC CONTRACT ROLLOUT — this workflow emits a uniquely named trusted check on
# pull-request heads. It does not make that context provider-required and does
# not claim that an LLM ran when ANTHROPIC_API_KEY is absent. A later reviewed
# Terraform/ruleset rollout must establish any provider enforcement and prove
# it with an exact-head canary. A relevant plan remains fail-closed here until a
# revision-bound maintainer override is recorded.

on:
  # pull_request_target is deliberate: this workflow checks out and executes
  # only the protected base revision, while treating the PR head as diff data.
  # That trusted context can both attest an override to the exact head SHA and
  # remove a stale override label from fork PRs.
  pull_request_target:
    # `labeled`/`unlabeled` matter: applying the documented `ai-review:override`
    # label must produce a NEW check run on the same head SHA, otherwise the
    # advertised escape hatch is unusable without an unrelated push.
    # `edited` matters: the PR body is an escalation input (the mandatory
    # HUMAN REVIEW REQUIRED marker), so editing the description must re-run the
    # gate rather than leave a stale pass on the current head SHA.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
    branches: [main]
permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review orchestration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # This is intentionally first so a previous head success is normally
      # superseded before any fallible checkout, fetch, or override preparation
      # runs. An API outage here cannot replace an older same-head custom
      # success. The native job will fail, but pull_request_target attaches it
      # to the protected base rather than the reviewed head. Therefore neither
      # result is ready to become a provider-required check until the separate
      # rollout proves a trusted head-attached transport mechanism or removes
      # mutable same-head inputs.
      - name: Mark reviewed head pending
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          check_id="$(gh api --method POST "repos/$REPO/check-runs" -f name='SPEC Contract Review' -f head_sha="$HEAD_SHA" -f status=in_progress -f output[title]='SPEC Contract Review' -f output[summary]='Trusted SPEC contract review is running.' --jq .id)"
          echo "check_id=$check_id" >> "$GITHUB_OUTPUT"

      # SECURITY: check out the *base* (protected) revision, not the PR merge
      # revision. The reviewer is the thing enforcing the gate, so it must never
      # be code the PR under review controls: a PR could otherwise replace
      # main() with a bare success to neuter its own gate, or exfiltrate the
      # ANTHROPIC_API_KEY / GH_TOKEN handed to the run step. The PR revision is
      # fetched below as *data* only (the diff), never executed.
      - name: Checkout trusted base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      # Fetch the untrusted head as data. refs/pull/<n>/head works for both
      # fork and same-repo pull requests.
      - name: Fetch PR head for diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          origin="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if [ -n "${PR:-}" ]; then
            git fetch --no-tags "$origin" "+refs/pull/${PR}/head:refs/ai-review/head"
          else
            git fetch --no-tags "$origin" "+${HEAD_SHA}:refs/ai-review/head"
          fi
          git cat-file -e "${HEAD_SHA}^{commit}"

      # This deterministic plan is built from authenticated Git objects before
      # reading ANTHROPIC_API_KEY or making any model call. The protected-base
      # authoring policy and exact activeHarnesses registry, never PR-controlled
      # replacements, own its policy and applicability inventory. The same plan
      # also authenticates every deterministic REVIEW.md §3 escalation input,
      # including PR-body and commit markers, so neutral cannot hide one.
      - name: Build authenticated SPEC governance review plan
        id: plan
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail
          set +e
          go run ./cmd/ai-review --review-plan > "$RUNNER_TEMP/ai-review-plan.json"
          status=$?
          set -e
          if [ "$status" -ne 0 ] || ! jq -e '(.version == "spec-contract/v3") and (.review_relevant | type == "boolean")' "$RUNNER_TEMP/ai-review-plan.json" >/dev/null 2>&1; then
            echo 'review_relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "review_relevant=$(jq -r '.review_relevant' "$RUNNER_TEMP/ai-review-plan.json")" >> "$GITHUB_OUTPUT"

      # A human override approves one reviewed revision, not a mutable branch.
      # Remove it as soon as a contributor pushes a new head; the resulting
      # unlabeled event reruns this gate without an override, and a maintainer
      # must deliberately reapply the label after reviewing that new revision.
      # The trusted pull_request_target token has the write permission declared
      # above, and the subsequent SHA attestation is a second fail-closed guard.
      - name: Clear override for a new pull request revision
        if: github.event_name == 'pull_request_target' && github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ai-review:override')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr edit "$PR" --repo "$REPO" --remove-label 'ai-review:override'

      # A label records who authorized an exception, but not which mutable PR
      # revision they reviewed. Record that revision in a bot-authored comment
      # from the trusted workflow. The detection step below accepts an override
      # only when this attestation matches the current PR head.
      - name: Attest override to the reviewed revision
        if: github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'ai-review:override'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPO/issues/$PR/comments" \
            -f body="<!-- ai-review-override-sha:$HEAD_SHA -->
          Human override attested by the trusted review workflow for `$HEAD_SHA`."

      # The override is revision-bound: a new pull-request head must never
      # inherit an approval for an earlier revision.
      - name: Detect override label
        id: override
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          labels="${LABELS:-}"
          # A new head must never inherit an override, even if a prior runner
          # was interrupted before it could remove the label.
          if [ "$ACTION" = "synchronize" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          reviewed_head="$HEAD_SHA"
          attested_head="$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body' 2>/dev/null | \
            sed -n 's/^<!-- ai-review-override-sha:\([0-9a-f]\{40\}\) -->$/\1/p' | \
            grep -Fx "$reviewed_head" | tail -n 1 || true)"
          # PR-controlled pull_request workflows can post as
          # github-actions[bot], so a bot-authored marker alone is not an
          # authorization decision. Bind the active label to its latest actor
          # and require GitHub to verify that actor has maintainer authority.
          label_actor="$(gh api --paginate "repos/$REPO/issues/$PR/events?per_page=100" \
            --jq '.[] | select(.event == "labeled" and .label.name == "ai-review:override") | .actor.login' 2>/dev/null | tail -n 1 || true)"
          label_permission=""
          if [ -n "$label_actor" ]; then
            label_permission="$(gh api "repos/$REPO/collaborators/$label_actor/permission" --jq .permission 2>/dev/null || true)"
          fi
          if printf '%s\n' "$labels" | grep -q '"ai-review:override"' && [ "$attested_head" = "$reviewed_head" ] && { [ "$label_permission" = maintain ] || [ "$label_permission" = admin ]; }; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      # The `secrets` context is NOT available in a step `if:` condition, so
      # key presence has to be resolved into a step output first. Same pattern
      # as .github/workflows/infra-repo-reconcile.yml's preflight. Emits only
      # the boolean — never the secret itself — into the step output.
      - name: Detect review key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AI review gate
        id: gate
        continue-on-error: true
        # Relevant SPEC governance changes and every deterministic escalation
        # run even without a credential, so an absent credential is human review
        # instead of a neutral result.
        if: steps.plan.outcome != 'success' || steps.plan.outputs.review_relevant == 'true' || steps.key.outputs.present == 'true' || steps.override.outputs.active == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_FORK: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository }}
          OVERRIDE: ${{ steps.override.outputs.active }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Bootstrap: the reviewer is deliberately run from the protected base
          # revision, so on the rollout PR that first introduces cmd/ai-review
          # the base has no such package. Fail closed with a clear message
          # rather than a confusing missing-package error; the documented
          # 'ai-review:override' label is the sanctioned path to land it.
          if [ ! -d cmd/ai-review ]; then
            if [ "${OVERRIDE:-false}" = "true" ]; then
              echo "::warning::cmd/ai-review is absent from the trusted base revision (bootstrap); passing on 'ai-review:override'."
              # AIREV-03: a human override always leaves a sticky audit result,
              # never just an ephemeral workflow log.
              if [ -n "${PR:-}" ]; then
                printf '%s\n' "<!-- ai-review-5d -->" \
                  "## ⚠️ AI Code Review — passed by human override (bootstrap)" "" \
                  "> The \`ai-review:override\` label is present and the trusted base revision does not yet contain \`cmd/ai-review\`, so no automated review could run." "" \
                  "This is the rollout PR that introduces the gate. The override is recorded on this PR as a label." "" \
                  "<sub>Review gate per REVIEW.md §2/§5.</sub>" > /tmp/ai-review-bootstrap.md
                gh pr comment "$PR" --repo "$REPO" --body-file /tmp/ai-review-bootstrap.md || true
              fi
              exit 0
            fi
            echo "::error::cmd/ai-review is absent from the trusted base revision. This is expected only on the rollout PR that introduces it: apply the 'ai-review:override' label after a human review to land it. Thereafter the gate runs from protected base code."
            exit 1
          fi
          go run ./cmd/ai-review

      # pull_request_target is pinned to trusted base code, but GitHub attaches
      # its job check suite to that base revision. Publish the authoritative
      # result explicitly on the reviewed PR head. The unique custom context is
      # the semantic-review verdict; the native job remains orchestration only.
      - name: Publish check on reviewed head
        id: publish
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.gate.outcome }}
          KEY_OUTCOME: ${{ steps.key.outcome }}
          KEY_PRESENT: ${{ steps.key.outputs.present }}
          OVERRIDE: ${{ steps.override.outputs.active }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          REVIEW_RELEVANT: ${{ steps.plan.outputs.review_relevant }}
        run: |
          set -euo pipefail
          conclusion=failure
          summary="Trusted review gate completed with outcome: $OUTCOME."
          if [ "$OUTCOME" = success ]; then
            conclusion=success
          elif [ "$OUTCOME" = skipped ] && [ "$PLAN_OUTCOME" = success ] && [ "$KEY_OUTCOME" = success ] && [ "$KEY_PRESENT" = false ] && [ "$OVERRIDE" != true ] && [ "$REVIEW_RELEVANT" = false ]; then
            # The ONLY non-failure skip: key detection ran, succeeded, and
            # affirmatively reported no key, with no override in play. Any
            # other skip means an earlier step (checkout / setup-go / fetch /
            # override or key detection) failed and GitHub's implicit
            # success() guard skipped the gate — that must stay `failure`.
            # Honest `neutral`, never a fabricated `success` (SPEC R4).
            conclusion=neutral
            summary='Neutral: ANTHROPIC_API_KEY is not configured and the authenticated plan has no changed SPEC.md, protected SPEC-review owner, or deterministic REVIEW.md escalation. No model approval is claimed.'
          fi
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          gh api --method PATCH "repos/$REPO/check-runs/${{ steps.pending.outputs.check_id }}" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f output[title]='SPEC Contract Review' \
            -f output[summary]="$summary"

      # The custom check is the semantic verdict. The distinct native job is a
      # source-level transport failure signal, not a satisfiable PR-head
      # required check. Do not let a failed check-runs API call leave it green.
      - name: Fail if SPEC Contract Review publication failed
        if: always() && steps.publish.outcome == 'failure'
        run: exit 1

      # An earlier revision may have left a sticky review comment — including a
      # "passed by human override" one, since applying the label makes the gate
      # run even with no key. Pushing a new revision clears that label and (with
      # no key) skips the gate entirely, so cmd/ai-review never runs to upsert
      # the record. Without this step the PR would show a neutral check next to
      # a stale comment still claiming a human override passed it. Retire the
      # marked comment here so the PR-facing audit trail matches the check.
      # Best-effort by design: the check conclusion already carries the verdict,
      # so a comment outage must not change the check conclusion.
      - name: Explain neutral review result
        if: always() && steps.publish.outputs.conclusion == 'neutral' && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' '<!-- ai-review-5d -->' \
            '## AI Code Review — neutral (no automated review ran)' '' \
            "> \`ANTHROPIC_API_KEY\` is not configured. The authenticated plan for \`$HEAD_SHA\` has no changed \`SPEC.md\`, protected SPEC-review owner, or deterministic REVIEW.md escalation, so this workflow check is neutral; no model approval is claimed." '' \
            'Any earlier review result or `ai-review:override` on this PR applied to an earlier revision and does **not** carry to this one.' '' \
            '<sub>Review gate per REVIEW.md §2/§5.</sub>' > /tmp/ai-review-neutral.md
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/ai-review-neutral.md \
            || echo "::warning::could not post the neutral review comment; the check still carries the verdict."
          # Prune older marked comments, keeping the one just posted. Cosmetic.
          ( gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
              --jq '.[] | select(.body | startswith("<!-- ai-review-5d -->")) | .id' \
            | head -n -1 \
            | while read -r id; do gh api -X DELETE "repos/$REPO/issues/comments/$id" >/dev/null || true; done ) || true

      - name: Fail if review gate failed
        if: always() && steps.gate.outcome == 'failure'
        run: exit 1
