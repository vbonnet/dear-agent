name: AI Code Review (5-dimension)

# Five-dimension multi-persona review per REVIEW.md §2, wired as a FAIL-CLOSED
# required merge gate. The review logic lives in cmd/ai-review (Go); this
# workflow is a thin wrapper whose job exit status is the enforcement signal.
#
# Fail-closed contract (see cmd/ai-review):
#   - only an "approved" outcome (or the audited 'ai-review:override' label)
#     exits 0; needs-work / rejected / needs-human-review block the merge.
#   - missing secret, fork PRs, per-dimension API failure, synthesis failure,
#     unparseable outcome, and oversize diffs all fail closed.
#
# Runs on every PR revision (opened/synchronize/reopened/ready_for_review), not
# just the draft->ready edge, so the check that gates the current head SHA
# actually reflects the current head SHA.
#
# Required status check: "5-Dimension AI Review" — registered in
# .github/rulesets/main.json.

on:
  pull_request:
    # `labeled`/`unlabeled` matter: applying the documented `ai-review:override`
    # label must produce a NEW check run on the same head SHA, otherwise the
    # advertised escape hatch is unusable without an unrelated push.
    # `edited` matters: the PR body is an escalation input (the mandatory
    # HUMAN REVIEW REQUIRED marker), so editing the description must re-run the
    # gate rather than leave a stale pass on the current head SHA.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: 5-Dimension AI Review
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # SECURITY: check out the *base* (protected) revision, not the PR merge
      # revision. The reviewer is the thing enforcing the gate, so it must never
      # be code the PR under review controls: a PR could otherwise replace
      # main() with a bare success to neuter its own gate, or exfiltrate the
      # ANTHROPIC_API_KEY / GH_TOKEN handed to the run step. The PR revision is
      # fetched below as *data* only (the diff), never executed.
      - name: Checkout trusted base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      # Fetch the untrusted head as data. refs/pull/<n>/head works for both
      # fork and same-repo PRs; merge-group heads live on origin already.
      - name: Fetch PR head for diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          origin="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if [ -n "${PR:-}" ]; then
            git fetch --no-tags "$origin" "+refs/pull/${PR}/head:refs/ai-review/head"
          else
            git fetch --no-tags "$origin" "+${HEAD_SHA}:refs/ai-review/head"
          fi
          git cat-file -e "${HEAD_SHA}^{commit}"

      # The override must survive the merge queue: a merge_group run cannot see
      # the originating PR's labels, so without this a human-overridden PR would
      # pass its PR check and then fail again on the synthetic merge-group SHA,
      # making the documented fallback unable to merge through the queue.
      - name: Detect override label
        id: override
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          labels="${LABELS:-}"
          if [ "$EVENT" = "merge_group" ]; then
            # gh-readonly-queue/<base>/pr-<number>-<sha>
            pr="$(printf '%s' "$HEAD_REF" | sed -n 's|.*/pr-\([0-9]\{1,\}\)-[0-9a-f]\{1,\}$|\1|p')"
            if [ -n "$pr" ]; then
              labels="$(gh api "repos/$REPO/pulls/$pr" --jq '[.labels[].name]' 2>/dev/null || echo '[]')"
            fi
          fi
          if printf '%s\n' "$labels" | grep -q '"ai-review:override"'; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AI review gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          OVERRIDE: ${{ steps.override.outputs.active }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Bootstrap: the reviewer is deliberately run from the protected base
          # revision, so on the rollout PR that first introduces cmd/ai-review
          # the base has no such package. Fail closed with a clear message
          # rather than a confusing missing-package error; the documented
          # 'ai-review:override' label is the sanctioned path to land it.
          if [ ! -d cmd/ai-review ]; then
            if [ "${OVERRIDE:-false}" = "true" ]; then
              echo "::warning::cmd/ai-review is absent from the trusted base revision (bootstrap); passing on 'ai-review:override'."
              # AIREV-03: a human override always leaves a sticky audit result,
              # never just an ephemeral workflow log.
              if [ -n "${PR:-}" ]; then
                printf '%s\n' "<!-- ai-review-5d -->" \
                  "## ⚠️ AI Code Review — passed by human override (bootstrap)" "" \
                  "> The \`ai-review:override\` label is present and the trusted base revision does not yet contain \`cmd/ai-review\`, so no automated review could run." "" \
                  "This is the rollout PR that introduces the gate. The override is recorded on this PR as a label." "" \
                  "<sub>Required gate per REVIEW.md §2/§5.</sub>" > /tmp/ai-review-bootstrap.md
                gh pr comment "$PR" --repo "$REPO" --body-file /tmp/ai-review-bootstrap.md || true
              fi
              exit 0
            fi
            echo "::error::cmd/ai-review is absent from the trusted base revision. This is expected only on the rollout PR that introduces it: apply the 'ai-review:override' label after a human review to land it. Thereafter the gate runs from protected base code."
            exit 1
          fi
          go run ./cmd/ai-review
