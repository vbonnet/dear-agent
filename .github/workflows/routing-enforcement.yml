name: Routing Enforcement

# Blocks temporal artifacts (Wayfinder SDLC runs, retros, designs, research)
# from being committed to this code repo. The forbidden globs are the SINGLE
# source of truth in .dear-agent.yml > forbidden-paths; this workflow does NOT
# carry its own copy of the list — it runs the routing-guard tool
# (cmd/routing-guard) which parses .dear-agent.yml at runtime. (A hardcoded
# copy that drifted from .dear-agent.yml is exactly what let the Wayfinder wf/
# leak through; see the 2026-06-19 DEAR retro in engram-research.)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Post-merge full-tree enforcement. The whole-tree regression guard used to
  # block PRs (see the job below); it now blocks main instead, where a
  # violation is one person's problem for one commit rather than every open
  # PR's problem at once.
  push:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight run when a new commit is pushed to the same PR — only the
# latest revision's routing matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check-forbidden-paths:
    name: Forbidden temporal artifact paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check routing (new files in this PR + whole-tree regression)
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          go build -o /tmp/routing-guard ./cmd/routing-guard

          : > report.txt
          rc=0
          policy_changed=false

          # 1) DIFF-SCOPED, BLOCKING. Any forbidden file added or renamed by
          #    this PR fails the job, on every event, with no exceptions. This
          #    is the gate and it is not weakened by anything below.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            if ! /tmp/routing-guard --diff "origin/$BASE_REF" >>report.txt 2>&1; then
              rc=1
            fi
            # A PR that edits the routing policy itself can turn an existing,
            # untouched file into a violation without --diff ever seeing that
            # file change (the file wasn't added or renamed, the policy that
            # governs it was). That violation is this PR's doing, not a
            # pre-existing one inherited from main, so it must block like any
            # other — treating it as advisory below would let a policy change
            # merge an internally invalid tree.
            if git diff --name-only "origin/$BASE_REF"...HEAD | grep -qx '\.dear-agent\.yml'; then
              policy_changed=true
            fi
          fi

          # 2) WHOLE-TREE REGRESSION GUARD. Still runs everywhere. It fails
          #    outright off pull_request, and on a pull_request it fails too
          #    when this PR is the one that changed the routing policy.
          #    Otherwise — an ordinary PR that inherits a violation it didn't
          #    create — it's advisory: reported, not blocking.
          #
          #    Why advisory in that case: a violation already on main is not
          #    caused by, and usually not fixable by, the PR that happens to be
          #    open. Failing every PR on it converts one person's mistake into
          #    a repo-wide merge freeze and trains people to reach for admin
          #    bypass — which is a worse outcome than the violation. The
          #    finding still lands in the PR comment (see below) even when
          #    it's advisory, and it still fails on push to main, turning main
          #    red and waking the main-health watchdog (see the "Routing
          #    Enforcement" entry in main-health-watchdog.yml's workflow_run
          #    trigger), which is the party that can actually fix it.
          if ! /tmp/routing-guard --all >>report.txt 2>&1; then
            if [ "$EVENT_NAME" = "pull_request" ] && [ "$policy_changed" != "true" ]; then
              echo "::warning ::Pre-existing routing violation on the base branch — reported, not blocking this PR. It blocks pushes to main."
              echo "advisory=true" >> "$GITHUB_OUTPUT"
            else
              rc=1
            fi
          fi

          echo "--- routing report ---"
          cat report.txt
          if [ "$rc" -ne 0 ]; then
            echo "violations=true" >> "$GITHUB_OUTPUT"
          else
            echo "violations=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Post PR comment on violation
        # `context.issue.number` only exists on pull_request events; this step
        # would throw on the push-to-main run added above. Runs on either a
        # blocking violation or an advisory (non-blocking, inherited) finding
        # so the report always reaches the PR, not only when it fails the job.
        if: github.event_name == 'pull_request' && (steps.check.outputs.violations == 'true' || steps.check.outputs.advisory == 'true')
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try { report = fs.readFileSync('report.txt', 'utf8'); } catch (e) {}
            const body = [
              '## :no_entry: Routing violation — temporal artifacts detected',
              '',
              'This PR adds (or the tree still contains) files that are **forbidden',
              'in this code repo**. Wayfinder SDLC runs, retros, designs, and',
              'research are temporal artifacts — they belong in',
              '[`engram-research`](https://github.com/vbonnet/engram-research)',
              '(conventionally `wf/<project>/`), not here.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              '### How to fix',
              '1. `git rm` the file(s) from this PR.',
              '2. Move the content into `engram-research` and open a PR there.',
              '3. Re-push without the artifact.',
              '',
              'The forbidden globs are defined once in `.dear-agent.yml >',
              'forbidden-paths` and enforced by the `routing-guard` tool',
              '(`cmd/routing-guard`), also runnable locally as a pre-commit',
              'hook: `make install-routing-guard-hook`.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail on violation
        if: steps.check.outputs.violations == 'true'
        run: |
          echo "ROUTING VIOLATION — see the report above and the PR comment."
          echo "Forbidden globs live in .dear-agent.yml > forbidden-paths."
          exit 1
