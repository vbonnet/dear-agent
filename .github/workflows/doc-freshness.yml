name: Document Freshness

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freshness:
    name: Freshness debt ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve shrink-only comparison ref
        id: baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            echo "ref=origin/${BASE_REF}" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              echo "ref=" >> "$GITHUB_OUTPUT"
            else
              echo "ref=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate living-document freshness
        run: go run ./tools/doc-audit -repo . -baseline-ref "${{ steps.baseline.outputs.ref }}"
