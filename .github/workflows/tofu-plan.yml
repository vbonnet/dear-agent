name: Tofu Plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/rulesets/main.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Tofu Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.5

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive

      - name: Stage backendless speculative configuration
        # A configured s3 backend still requires initialization even when the
        # plan disables refresh. This disposable checkout is moved to the
        # implicit local backend; the production backend file remains tracked.
        run: mv -f backend.tf /tmp/tofu-plan-backend.tf

      - name: tofu init (no backend)
        run: tofu init -backend=false

      - name: tofu validate
        run: tofu validate

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Canonical ruleset projection assertions
        # `validate` proves the configuration parses; it cannot see a malformed
        # canonical ruleset document being projected into a weaker provider
        # resource. These tests can: each copies infra/ into a temporary
        # repository wired to an ephemeral local backend, plans the checked-in
        # fixture inventory for real, and asserts on what the plan says.
        #
        # Self-contained by construction — own temp tree, own backend, own
        # credential-free environment — so they neither read nor disturb the
        # speculative plan below.
        working-directory: ${{ github.workspace }}
        env:
          DEAR_AGENT_RUN_TOFU_MUTATION_TESTS: "1"
        run: |
          go test -count=1 -run '^(TestCanonicalRulesetProjectionPlansCleanly|TestCanonicalRulesetProjectionRejectsInvalidRequiredReviewers|TestCanonicalRulesetProjectionRequiresDefaultBranchTarget)$' ./infra/

      - name: tofu plan
        id: plan
        continue-on-error: true
        run: |
          # The checked-in configuration refuses every plan without an
          # encryption method. This speculative plan is never saved, so use a
          # fresh cryptographic random passphrase scoped to this process. A
          # public run identifier is intentionally not key material.
          plan_passphrase="$(openssl rand -hex 32)"
          export TF_ENCRYPTION
          TF_ENCRYPTION="$(printf '%s\n' \
            'key_provider "pbkdf2" "speculative" {' \
            "  passphrase = \"${plan_passphrase}\"" \
            '}' \
            'method "aes_gcm" "speculative" {' \
            '  keys = key_provider.pbkdf2.speculative' \
            '}' \
            'plan {' \
            '  method = method.aes_gcm.speculative' \
            '}')"
          unset plan_passphrase
          tofu plan -refresh=false -no-color 2>&1 | tee /tmp/plan-output.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TF_VAR_personal_owner: vbonnet
          TF_VAR_org_name: dear-labs
          # The private fleet inventory is deliberately unavailable to a PR
          # workflow. Empty maps still exercise the root/module type contract.
          TF_VAR_active_repos: "{}"
          TF_VAR_archived_repos: "{}"
          # This PR workflow executes contributor-controlled Terraform, so it
          # must never receive the personal OAuth credential. The plan is
          # backendless and refreshless; a non-empty placeholder exercises the
          # module validation without exposing the real secret.
          TF_VAR_claude_code_oauth_token: plan-only-placeholder

      - name: Format plan comment
        if: always()
        run: |
          {
            echo "### Tofu Plan"
            echo ""
            echo "\`\`\`hcl"
            cat /tmp/plan-output.txt
            echo "\`\`\`"
            echo ""
            echo "_Plan run against \`infra/\` with \`-backend=false -refresh=false\` (syntax + provider validation only; no live state comparison)._"
          } > /tmp/plan-comment.md

      - name: Post plan as PR comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: tofu-plan
          path: /tmp/plan-comment.md

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
