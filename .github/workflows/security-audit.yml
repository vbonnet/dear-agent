name: Security Audit

# Daily defense-in-depth scan that complements the govulncheck gate in ci.yml
# (run on every PR). This workflow inspects the CI surface itself:
#
#   1. govulncheck against the current main (catches transitive bumps that
#      land between PRs).
#   2. Unpinned GitHub Actions — every third-party action MUST be pinned by
#      commit SHA. Tags can be moved.
#   3. Overly permissive GITHUB_TOKEN — flags workflows that grant
#      write-all or omit a top-level `permissions:` block.
#   4. pull_request_target usage — known-dangerous trigger that runs with
#      the target repo's secrets against an untrusted PR.
#   5. Known-compromised action versions — small static list, expand as we
#      learn about new incidents.
#
# Opens a rolling `security-audit` issue when any of the static checks fire
# (govulncheck failure already kills the job, which is enough signal).

on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  security-events: read

env:
  GIT_TERMINAL_PROMPT: "0"

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Mirrors ci.yml's govulncheck package-mode + allowlist filter so the
      # daily run agrees with the PR gate. See ci.yml's `govulncheck` job for
      # the rationale behind `-scan package` and the GO-2025-3884 entry.
      - name: Run govulncheck
        run: |
          set -euo pipefail
          govulncheck -format json -scan package ./... > vulncheck.json
          unhandled=$(jq -c \
            --argjson allow '["GO-2025-3884", "GO-2026-5932"]' \
            'select(.finding != null)
             | select(.finding.osv as $id | $allow | index($id) | not)
             | .finding' \
            vulncheck.json)
          if [ -n "$unhandled" ]; then
            echo "::error::Unallowed vulnerabilities found:"
            echo "$unhandled"
            exit 1
          fi
          echo "No unallowed vulnerabilities."
        env:
          GOWORK: "off"

  workflow-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # The mutation step is default-branch-only. Serialize that ref's entire
      # detector/reconciliation job without blocking independent diagnostics.
      group: security-audit-issue-reconciliation-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      # Static list of known-compromised action versions. Expand when
      # incidents are reported. Format: `owner/repo@ref`.
      - name: Check for known-compromised actions
        id: compromised
        run: |
          set -euo pipefail
          compromised=(
            "tj-actions/changed-files@v44.5.1"
            "tj-actions/changed-files@v44.5.2"
            "tj-actions/changed-files@v44.5.3"
            "tj-actions/changed-files@v44.5.4"
            "tj-actions/changed-files@v44.5.5"
            "tj-actions/changed-files@v44.5.6"
            "tj-actions/changed-files@v44.5.7"
            "reviewdog/action-setup@v1.3.0"
          )
          hits=""
          for ref in "${compromised[@]}"; do
            if grep -rn "uses:[[:space:]]*${ref}" .github/workflows/ 2>/dev/null; then
              hits="${hits}\n- ${ref}"
            fi
          done
          if [ -n "$hits" ]; then
            {
              echo "compromised<<__EOF__"
              printf '%b\n' "$hits"
              echo "__EOF__"
            } >> "$GITHUB_ENV"
          fi

      - name: Check for unpinned third-party actions
        run: |
          set -euo pipefail
          # First-party actions (actions/*, github/*) and reusable workflows
          # in this repo are excluded — the threat is third-party
          # mutable refs. Everything else must be a 40-char hex SHA.
          # `grep -rn` output is file:line:content, so a commented-out
          # `#   uses: ...` example (go-ci-reusable.yml's usage docs) matched
          # as a live unpinned action. Drop comment lines: only a real `uses:`
          # key can pull in third-party code.
          violations=$(grep -rEn "uses:[[:space:]]+[^[:space:]]+" .github/workflows/ \
            | grep -vE "^[^:]+:[0-9]+:[[:space:]]*#" \
            | grep -vE "uses:[[:space:]]+(actions|github)/" \
            | grep -vE "uses:[[:space:]]+\./" \
            | grep -vE "uses:[[:space:]]+[^@]+@[0-9a-f]{40}( |$)" || true)
          if [ -n "$violations" ]; then
            echo "::warning::Third-party actions not pinned by SHA:"
            echo "$violations"
            {
              echo "unpinned<<__EOF__"
              echo "$violations"
              echo "__EOF__"
            } >> "$GITHUB_ENV"
          fi

      - name: Check for missing or overly permissive permissions
        run: |
          set -euo pipefail
          findings=""
          for f in .github/workflows/*.yml; do
            # 1) No top-level permissions block at all — token defaults
            #    to the repo's setting, which may be write-all.
            if ! grep -qE "^permissions:" "$f"; then
              findings="${findings}\n- ${f}: no top-level \`permissions:\` block"
              continue
            fi
            # 2) Explicit write-all.
            if grep -qE "^permissions:[[:space:]]*write-all" "$f"; then
              findings="${findings}\n- ${f}: \`permissions: write-all\`"
            fi
            # 3) A key GITHUB_TOKEN does not accept. GitHub rejects the whole
            #    workflow file, so the run dies before any job starts — no job
            #    log, no failing step, just a red workflow. `administration:
            #    read` did exactly that to bypassed-merge-audit.yml and took
            #    main red: it is a fine-grained-PAT repository permission, not
            #    a GITHUB_TOKEN scope, and the two are easy to confuse because
            #    the API docs describe the requirement in PAT terms.
            #    Scans EVERY permissions: block, not just the top-level one:
            #    job-level blocks take the same GITHUB_TOKEN scopes and an
            #    invalid key there rejects the file just as hard.
            bad=$(awk '
              # A bare `permissions:` opens a block; the inline forms
              # (`{}`, `read-all`, `write-all`) have no keys to check.
              match($0, /^[[:space:]]*permissions:[[:space:]]*$/) {
                inblock = 1
                blockindent = index($0, "p") - 1
                next
              }
              # Blank and comment lines never close a block.
              /^[[:space:]]*$/ || /^[[:space:]]*#/ { next }
              inblock {
                indent = match($0, /[^[:space:]]/) - 1
                if (indent <= blockindent) { inblock = 0; next }
                key = $1; sub(/:.*/, "", key); print key
              }
            ' "$f" | grep -vxE "actions|attestations|checks|contents|deployments|discussions|id-token|issues|models|packages|pages|pull-requests|security-events|statuses" | sort -u || true)
            if [ -n "$bad" ]; then
              findings="${findings}\n- ${f}: invalid \`permissions:\` key(s) — $(echo "$bad" | tr '\n' ' ')(GitHub rejects the file; the run dies before any job starts)"
            fi
          done
          if [ -n "$findings" ]; then
            {
              echo "perm_findings<<__EOF__"
              printf '%b\n' "$findings"
              echo "__EOF__"
            } >> "$GITHUB_ENV"
          fi

      - name: Check for pull_request_target usage
        run: |
          set -euo pipefail
          # Match the trigger declaration only. A bare substring grep also hit
          # this file's own header comment, its own `grep` line, and its own
          # issue-body heading, plus review.yml's four explanatory comments —
          # nine self-inflicted findings that kept the audit permanently dirty
          # and taught readers to ignore it.
          #
          # review.yml is the one deliberate, reviewed use (see its header: the
          # trigger is pinned to trusted base code and never checks out PR
          # code). It is allowlisted by name so a NEW pull_request_target
          # anywhere else still fires.
          hits=$(grep -rEn '^[[:space:]]*pull_request_target:' .github/workflows/ \
            | grep -vE "^\.github/workflows/review\.yml:" || true)
          if [ -n "$hits" ]; then
            echo "::warning::pull_request_target detected:"
            echo "$hits"
            {
              echo "prt_hits<<__EOF__"
              echo "$hits"
              echo "__EOF__"
            } >> "$GITHUB_ENV"
          fi

      # Label ownership, complete pagination, exact-title matching, body
      # replacement, duplicate consolidation, and clean close live together
      # behind one tested provider boundary. Detector policy stays above.
      - name: Reconcile security-audit issue
        if: ${{ github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GOWORK: "off"
        run: go run ./tools/security-audit-issues -repo "$REPO"
