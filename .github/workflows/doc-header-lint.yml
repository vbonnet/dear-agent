name: Doc Header Lint

# Flags the single-line bold metadata "header block" anti-pattern in
# Markdown docs: two or more **Label:** bold-field markers crammed onto one
# physical line, with no line break between fields, near the top of a file
# (e.g. "**Status:** authoritative · **Last updated:** 2026-06-11"). See
# docs/doc-header-format.md for the canonical replacement format.
#
# Start posture: continue-on-error=true, same as doc-proximity.yml. The
# linter finds two pre-existing violations at introduction time (REVIEW.md,
# docs/code-review-automation-setup.md) that this workflow does not fix —
# that backfill is tracked separately, alongside the larger backfill in the
# sibling engram-research repo. Failing the build today would block every
# PR on unrelated pre-existing debt. Ratchet path: once those two files (and
# any others introduced before this workflow existed) are fixed, flip
# continue-on-error off and add this job to branch-protection
# required-status-checks so it starts blocking new violations outright.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  header-lint:
    name: Header block format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informational — does not block merge until the pre-existing backlog
    # (REVIEW.md, docs/code-review-automation-setup.md) is cleared. See the
    # ratchet-path note above.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate doc metadata header format
        run: go run ./tools/header-lint -repo .
