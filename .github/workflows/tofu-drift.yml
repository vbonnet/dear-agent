name: Tofu Drift Detection

# Scheduled REAL drift detection: unlike tofu-plan.yml (which runs on PRs with
# `-backend=false -refresh=false` — syntax/provider validation only, no live
# comparison), this job initialises the real R2 backend and refreshes against
# live GitHub, so out-of-band changes to repo settings / rulesets are caught.
#
# Exit codes from `tofu plan -detailed-exitcode`:
#   0 = no changes (no drift)   1 = error   2 = drift detected
#
# REQUIRED SECRETS (configure in repo settings → Secrets and variables → Actions):
#   INFRA_GITHUB_TOKEN      PAT with repo + admin:org scope across the managed
#                           fleet (the default GITHUB_TOKEN only sees THIS repo,
#                           so it cannot refresh other repos' settings).
#   R2_ACCOUNT_ID           Cloudflare account id (for the S3 endpoint).
#   R2_STATE_BUCKET         R2 bucket holding the tofu state.
#   R2_ACCESS_KEY_ID        R2 S3 access key id.
#   R2_SECRET_ACCESS_KEY    R2 S3 secret access key.
#   CLAUDE_CODE_OAUTH_TOKEN OAuth token applied to opted-in review repos.
# These are the same credentials used for a local `tofu apply`; nothing new is
# invented here.
#
# When the credentials are absent the enforcement cannot run at all. Failing the
# job paints `main` red every single day and makes main-health-watchdog file a
# fresh incident each time — for a condition no commit caused and no code change
# can fix. The daily red carries exactly one bit ("still not provisioned") and
# drowns the failures that mean something.
#
# So the preflight is its own job. When the secrets are missing it warns loudly,
# writes the reason into the run summary, and leaves the enforcement job SKIPPED
# — visibly not-run, which is honest, rather than a green run that would claim a
# drift check happened. Provisioning the secrets turns enforcement back on with
# no further change.

on:
  schedule:
    - cron: "17 8 * * *" # daily 08:17 UTC; offset minute to avoid the top-of-hour stampede
  workflow_dispatch: {}

concurrency:
  group: tofu-drift
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # to open/update the drift alert issue

jobs:
  preflight:
    name: Credentials preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Required secrets present
        id: check
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_STATE_BUCKET: ${{ secrets.R2_STATE_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          INFRA_GITHUB_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          missing=()
          for v in R2_ACCOUNT_ID R2_STATE_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY INFRA_GITHUB_TOKEN CLAUDE_CODE_OAUTH_TOKEN; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::drift detection did not run — missing secrets: ${missing[*]}"
          {
            echo "### Tofu drift detection did not run"
            echo
            echo "Missing repository secrets: \`${missing[*]}\`"
            echo
            echo "Live infrastructure was **not** compared against \`infra/\`."
            echo "Configure the secrets (see this workflow's header) to enable enforcement."
          } >> "$GITHUB_STEP_SUMMARY"

  drift:
    name: Tofu Drift Detection
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2
        with:
          tofu_version: 1.12.5

      - name: tofu init (real R2 backend)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.R2_STATE_BUCKET }}" \
            -backend-config="endpoints={s3=\"https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"

      - name: tofu plan -detailed-exitcode (refresh against live)
        id: plan
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
          TF_VAR_personal_owner: vbonnet
          TF_VAR_org_name: dear-labs
          TF_VAR_claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          private_output="${RUNNER_TEMP}/tofu-drift.txt"
          trap 'rm -f "${private_output}"' EXIT
          # This plan is inspected in-run and never saved. Supply the enforced
          # plan encryption method with fresh process-local randomness; never
          # derive encryption material from a public workflow/run identifier.
          plan_passphrase="$(openssl rand -hex 32)"
          export TF_ENCRYPTION
          TF_ENCRYPTION="$(printf '%s\n' \
            'key_provider "pbkdf2" "speculative" {' \
            "  passphrase = \"${plan_passphrase}\"" \
            '}' \
            'method "aes_gcm" "speculative" {' \
            '  keys = key_provider.pbkdf2.speculative' \
            '}' \
            'plan {' \
            '  method = method.aes_gcm.speculative' \
            '}')"
          unset plan_passphrase
          # Provider/state evidence is private. Capture it only in the runner's
          # ephemeral directory and publish the exit status, never plan bytes.
          tofu plan -detailed-exitcode -no-color >"${private_output}" 2>&1
          plan_exit=$?
          echo "exitcode=${plan_exit}" >> "$GITHUB_OUTPUT"

      - name: Evaluate result
        env:
          GH_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
          CODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          echo "plan exit code: ${CODE}"
          case "${CODE}" in
            0) echo "No drift. Live infrastructure matches the IaC." ;;
            2)
              echo "::warning::DRIFT DETECTED — live settings differ from IaC."
              # De-dupe: reuse an open drift issue if one exists, else open one.
              body="$(printf 'Scheduled infrastructure reconciliation detected provider-visible drift on %s (run %s). Private plan, state, inventory, and provider evidence were withheld. Reconcile only through an authorized private environment.' \
                "$(date -u +%Y-%m-%dT%H:%MZ)" "${GITHUB_RUN_ID}")"
              existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --label infra-drift --json number --jq '.[0].number' 2>/dev/null || true)"
              if [ -n "${existing}" ]; then
                gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
              else
                gh issue create --repo "${GITHUB_REPOSITORY}" --title "infra drift detected" \
                  --label infra-drift --body "${body}" || \
                gh issue create --repo "${GITHUB_REPOSITORY}" --title "infra drift detected" --body "${body}"
              fi
              exit 1
              ;;
            *)
              echo "::error::tofu plan errored (exit ${CODE})."
              exit 1
              ;;
          esac
