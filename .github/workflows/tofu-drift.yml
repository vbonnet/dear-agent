name: Tofu Drift Detection

# Scheduled REAL drift detection: unlike tofu-plan.yml (which runs on PRs with
# an ephemeral local backend, public fixture inventory, and `-refresh=false` —
# configuration/module validation only, no live comparison), this job
# initialises the real R2 backend and refreshes against live GitHub, so
# out-of-band changes to repo settings / rulesets are caught.
#
# Exit codes from `tofu plan -detailed-exitcode`:
#   0 = no changes (no drift)   1 = error   2 = drift detected
#
# REQUIRED SECRETS (configure in repo settings → Secrets and variables → Actions):
#   INFRA_GITHUB_TOKEN      PAT with repo + admin:org scope across the managed
#                           fleet (the default GITHUB_TOKEN only sees THIS repo,
#                           so it cannot refresh other repos' settings).
#   R2_ACCOUNT_ID           Cloudflare account id (for the S3 endpoint).
#   R2_STATE_BUCKET         R2 bucket holding the tofu state.
#   R2_ACCESS_KEY_ID        R2 S3 access key id.
#   R2_SECRET_ACCESS_KEY    R2 S3 secret access key.
#   CLAUDE_CODE_OAUTH_TOKEN OAuth token applied to opted-in review repos.
#   INFRA_ACTIVE_REPOS      Complete private active_repos JSON value.
#   INFRA_ARCHIVED_REPOS    Complete private archived_repos JSON value.
# These are the same credentials used for a local `tofu apply`; nothing new is
# invented here.
#
# When the credentials are absent the enforcement cannot run at all. Failing the
# scheduled run painted `main` red every day and made main-health-watchdog file
# a fresh incident each time, for a condition no commit caused and no code
# change can fix (PR #1290). The preflight is therefore its own job: with the
# secrets missing it warns, records the reason in the run summary, and leaves
# the enforcement job SKIPPED — visibly not-run, rather than a green run that
# would claim a check happened. Provisioning the secrets turns enforcement back
# on with no further change.

on:
  schedule:
    - cron: "17 8 * * *" # daily 08:17 UTC; offset minute to avoid the top-of-hour stampede
  repository_dispatch:
    types: [tofu-drift]

concurrency:
  group: tofu-drift
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # to open/update the drift alert issue

jobs:
  preflight:
    name: Credentials preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Required secrets present
        id: check
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_STATE_BUCKET: ${{ secrets.R2_STATE_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          INFRA_GITHUB_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          INFRA_ACTIVE_REPOS: ${{ secrets.INFRA_ACTIVE_REPOS }}
          INFRA_ARCHIVED_REPOS: ${{ secrets.INFRA_ARCHIVED_REPOS }}
        run: |
          missing=()
          for v in R2_ACCOUNT_ID R2_STATE_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY INFRA_GITHUB_TOKEN CLAUDE_CODE_OAUTH_TOKEN INFRA_ACTIVE_REPOS INFRA_ARCHIVED_REPOS; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::drift detection did not run — missing secrets: ${missing[*]}"
          {
            echo "### Tofu drift detection did not run"
            echo
            echo "Missing repository secrets: \`${missing[*]}\`"
            echo
            echo "Live infrastructure was **not** compared against \`infra/\`."
            echo "Configure the secrets (see this workflow's header) to enable enforcement."
          } >> "$GITHUB_STEP_SUMMARY"

  drift:
    name: Tofu Drift Detection
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2
        with:
          tofu_version: latest

      - name: tofu init (real R2 backend)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_STATE_BUCKET: ${{ secrets.R2_STATE_BUCKET }}
        run: |
          set -euo pipefail
          tofu init \
            -backend-config="bucket=${R2_STATE_BUCKET}" \
            -backend-config="endpoints={s3=\"https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com\"}"

      - name: tofu plan -detailed-exitcode (refresh against live)
        id: plan
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
          TF_VAR_personal_owner: vbonnet
          TF_VAR_org_name: dear-labs
          TF_VAR_claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TF_VAR_active_repos: ${{ secrets.INFRA_ACTIVE_REPOS }}
          TF_VAR_archived_repos: ${{ secrets.INFRA_ARCHIVED_REPOS }}
        run: |
          set -u
          output="${RUNNER_TEMP}/tofu-drift.txt"
          trap 'rm -f -- "$output"' EXIT
          set +e
          tofu plan -detailed-exitcode -no-color >"$output" 2>&1
          code=$?
          set -e
          echo "exitcode=${code}" >> "$GITHUB_OUTPUT"

      - name: Evaluate result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          set -euo pipefail
          echo "plan exit code: ${CODE}"
          case "${CODE}" in
            0) echo "No drift. Live infrastructure matches the IaC." ;;
            2)
              echo "::warning::DRIFT DETECTED — live settings differ from IaC."
              # De-dupe: reuse an open drift issue if one exists, else open one.
              body="$(printf 'Scheduled drift detection found a difference between live GitHub settings and infra/ IaC on %s (run %s). Detailed plan output is intentionally withheld because the private inventory must not enter public logs or issues. Resolve by updating IaC for an intentional provider change, or by generating, reviewing, and applying an exact saved production plan in a private trusted environment. Never apply diagnostic output directly.' \
                "$(date -u +%Y-%m-%dT%H:%MZ)" "${GITHUB_RUN_ID}")"
              existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --label infra-drift --json number --jq '.[0].number // empty')"
              if [ -n "${existing}" ]; then
                gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
              else
                gh issue create --repo "${GITHUB_REPOSITORY}" --title "infra drift detected" \
                  --label infra-drift --body "${body}"
              fi
              exit 1
              ;;
            *)
              echo "::error::tofu plan errored (exit ${CODE})."
              exit 1
              ;;
          esac
