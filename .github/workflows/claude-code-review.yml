name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Deny-all floor. Every job below declares its own least-privilege
# `permissions:` block, which replaces this one entirely — this exists so a
# job added later starts with zero scopes instead of inheriting the
# repository default.
permissions: {}

jobs:
  claude-review:
    # Skip drafts (no point spending review budget on WIP) and fork PRs.
    # GitHub does not pass Actions secrets to pull_request workflows from
    # forks; the same-repository condition also avoids running a privileged
    # review action against untrusted fork content. Revisit if external
    # contributions are ever welcomed; see docs/anthropics/claude-code-action
    # security guidance on fork handling.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Write, not read: this job publishes its own agentic-review:claude:*
      # lifecycle labels, which are what the merge gate reads.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Published BEFORE the model is invoked, not after. The gate treats a
      # ready pull request with no started label as not mergeable, so this step
      # is what closes the window between going ready and the review resolving.
      # Labelling after the model would leave that window open for exactly as
      # long as the review takes.
      - name: Mark the Claude review as started
        uses: ./.github/actions/agentic-review-label
        with:
          family: claude
          phase: started
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # Always runs: a reviewer that failed must publish its error state, or
      # the gate cannot tell a crashed reviewer from one still thinking and
      # will hold the merge until the deadline expires.
      - name: Publish the Claude review verdict
        if: always()
        uses: ./.github/actions/agentic-review-verdict
        with:
          family: claude
          outcome: ${{ steps.claude-review.outcome }}
          # Configurable because the login a reviewer app posts under is the
          # app's business and can change without notice. An unmatched login
          # fails this job loudly rather than letting the family drift into a
          # silent "down" that the quorum merges around.
          reviewer-logins: ${{ vars.AGENTIC_REVIEW_CLAUDE_LOGINS || 'claude[bot],github-actions[bot]' }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
