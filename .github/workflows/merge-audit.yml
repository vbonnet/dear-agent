name: Merge Audit

# Post-merge detection tier of safe-merge (P6). Runs on every push to the
# default branch and validates the merge that just landed:
#   - no associated PR  -> direct push to a protected branch
#   - unresolved review threads at merge
#   - required checks red or pending at merge
#
# "Required" means the contexts branch protection actually gates on, resolved
# from the effective-rules endpoint. Advisory checks (AI review, SPEC contract
# review, and the other non-gating bots) are deliberately NOT part of the
# predicate: branch protection permits merging over them, so treating every
# check run as required manufactures a violation for a merge that broke no
# rule. `bypassed-merge-audit.yml` scopes the same way; the two detectors
# answer the same question and must not disagree.
#
# Detect + ALERT only: on a violation it opens (or updates) a GitHub Issue
# labelled "merge-audit". It NEVER reverts or rewrites history — remediation is
# a human decision. The weekly cross-repo sweep lives in cmd/merge-audit; this
# workflow is the in-repo, per-merge backstop.
#
# Restricted to PUBLIC repositories: GITHUB_TOKEN issue/PR scopes and the
# review-thread GraphQL fields behave consistently there, and the public repos
# are the ones whose merge integrity is externally visible.

on:
  push:
    branches: [main]

permissions:
  issues: write
  contents: read
  pull-requests: read

env:
  GIT_TERMINAL_PROMPT: "0"

jobs:
  audit:
    name: Merge Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Public repos only — see header.
    if: github.event.repository.private == false
    steps:
      - name: Ensure merge-audit label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create merge-audit \
            --color "b60205" \
            --description "Post-merge safe-merge predicate violation" \
            --repo "$REPO" 2>/dev/null || true

      - name: Validate merge predicate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Resolve PR association from the pushed commit itself. A bounded PR
          # list becomes incomplete during merge bursts and can turn a valid
          # PR merge into a false direct-push alert.
          #
          # This endpoint is eventually consistent: this workflow starts within
          # seconds of the merge, and the association (or `merged_at`) is not
          # always visible yet. An empty first answer therefore means "not
          # indexed yet" at least as often as it means "direct push", so retry
          # before concluding the latter.
          pr_num=""
          for attempt in 1 2 3 4 5; do
            pr_num=$(timeout 30 gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPO}/commits/${SHA}/pulls?per_page=100" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].number // empty') || {
                echo "::error::Could not resolve pull-request association for ${SHA}; refusing to classify it as a direct push."
                exit 1
              }
            [ -n "$pr_num" ] && break
            [ "$attempt" -lt 5 ] && sleep $(( attempt * 5 ))
          done

          findings=""

          if [ -z "$pr_num" ]; then
            # No PR introduced this commit → a direct push to main.
            findings="- ⛔ **Direct push**: commit \`${SHA}\` landed on \`main\` with no associated PR."
          else
            echo "Auditing PR #${pr_num} (merge commit ${SHA})"

            # Unresolved review threads at merge.
            unresolved=$(timeout 30 gh api graphql \
              -f owner="${REPO%/*}" -f name="${REPO#*/}" -F pr="${pr_num}" \
              -f query='query($owner:String!,$name:String!,$pr:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$pr){
                    reviewThreads(first:100){ nodes { isResolved } }
                  }}}' \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved|not)] | length')

            if [ "${unresolved:-0}" -gt 0 ]; then
              findings="${findings}
          - 💬 **Unresolved threads**: PR #${pr_num} merged with ${unresolved} unresolved review thread(s)."
            fi

            # Required checks red or pending at merge time. Resolve what is
            # actually required from the effective-rules endpoint (the legacy
            # branch-protection endpoint omits repository rulesets) rather than
            # treating every check run as required — see the file header.
            required=$(timeout 30 gh api "repos/${REPO}/rules/branches/main" \
              --jq '[.[] | select(.type == "required_status_checks")
                     | .parameters.required_status_checks[]?.context] | unique') || {
                echo "::error::Could not resolve the required checks for main; refusing to classify this merge."
                exit 1
              }
            echo "Required checks: ${required}"

            pr_meta=$(timeout 30 gh pr view "$pr_num" --repo "$REPO" \
              --json headRefOid,mergedAt)
            head_sha=$(jq -r '.headRefOid' <<<"$pr_meta")
            merged_at=$(jq -r '.mergedAt' <<<"$pr_meta")

            runs=$(timeout 30 gh api "repos/${REPO}/commits/${head_sha}/check-runs" \
              --jq '.check_runs // []' 2>/dev/null || echo '[]')

            # Failed before the merge.
            red=$(jq -r --argjson required "$required" --arg merged "$merged_at" \
              '[.[] | select(.name as $n | ($required | index($n)) != null) | select(
                       .status == "completed" and
                       (.conclusion // "") != "" and
                       (.conclusion // "") != "success" and
                       (.conclusion // "") != "skipped" and
                       (.conclusion // "") != "neutral" and
                       (.completed_at // "z") <= $merged
                     ) | "\(.name) [\(.conclusion)]"] | join(", ")' <<<"$runs")

            # Still in flight when the merge landed.
            pending=$(jq -r --argjson required "$required" --arg merged "$merged_at" \
              '[.[] | select(.name as $n | ($required | index($n)) != null) | select(
                       (.started_at // "z") <= $merged and
                       (.status != "completed" or (.completed_at // "z") > $merged)
                     ) | .name] | join(", ")' <<<"$runs")

            if [ -n "$red" ]; then
              findings="${findings}
          - ❌ **Required checks not green**: PR #${pr_num} merged with failing required checks: ${red}."
            fi
            if [ -n "$pending" ]; then
              findings="${findings}
          - ⏳ **Required checks pending**: PR #${pr_num} merged while required checks were still running: ${pending}."
            fi
          fi

          {
            echo "findings<<__EOF__"
            printf '%s\n' "$findings"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Open merge-audit issue on violation
        if: env.findings != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="merge-audit: predicate violation at ${SHA}"
          body="The post-merge audit detected a safe-merge predicate violation on \`main\`:

          ${findings}

          **Commit:** ${SHA}

          This is **detect + alert only** — no automatic revert was performed.
          Investigate and, if the merge was unsafe, revert or follow up manually.

          _Auto-filed by \`.github/workflows/merge-audit.yml\` (safe-merge P6)._"

          timeout 30 gh issue create \
            --repo "$REPO" \
            --title "$title" \
            --body "$body" \
            --label "merge-audit"
