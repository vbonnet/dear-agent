name: Infra Repo Reconciliation

# Trusted-default-branch reconciliation of live provider inventory against the
# complete private personal-account OpenTofu inventory. Organization-scoped
# resources are reconciled by the full OpenTofu drift job until a distinct
# organization repository inventory exists. Repository identities never enter
# public logs, issues, comments, or artifacts; only aggregate counts are
# published.
#
# REQUIRED SECRETS:
#   INFRA_GITHUB_TOKEN   PAT that can list the private personal-account fleet
#   INFRA_ACTIVE_REPOS   complete private active_repos JSON value
#   INFRA_ARCHIVED_REPOS complete private archived_repos JSON value
#
# When those inputs are absent the reconciliation cannot run at all. Failing the
# scheduled run painted `main` red every day and made main-health-watchdog file
# a fresh incident each time, for a condition no commit caused and no code
# change can fix (PR #1290). The preflight is therefore its own job, deciding
# for both triggers rather than branching on the event name: with the inputs
# missing it warns, records the reason in the run summary, and leaves the
# reconcile job SKIPPED — visibly not-run, rather than a green run claiming an
# audit happened. Provisioning the secrets turns enforcement back on with no
# further change.

on:
  schedule:
    - cron: "37 8 * * *"
  repository_dispatch:
    types: [infra-repo-reconcile]

concurrency:
  group: infra-reconcile
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    name: Inventory preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Token + inventory present
        id: check
        env:
          INFRA_GITHUB_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
          ACTIVE_REPOS_JSON: ${{ secrets.INFRA_ACTIVE_REPOS }}
          ARCHIVED_REPOS_JSON: ${{ secrets.INFRA_ARCHIVED_REPOS }}
        run: |
          missing=()
          for v in INFRA_GITHUB_TOKEN ACTIVE_REPOS_JSON ARCHIVED_REPOS_JSON; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::reconciliation did not run — missing: ${missing[*]}"
          {
            echo "### Infra repo reconciliation did not run"
            echo
            echo "Missing repository secrets: \`${missing[*]}\`"
            echo
            echo "Live repositories were **not** diffed against the IaC inventory."
            echo "Configure the secrets (see this workflow's header) to enable enforcement."
          } >> "$GITHUB_STEP_SUMMARY"

  reconcile:
    name: Infra Repo Reconciliation
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted inventory validator
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reconcile complete provider and IaC inventories
        env:
          GH_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
          ACTIVE_REPOS_JSON: ${{ secrets.INFRA_ACTIVE_REPOS }}
          ARCHIVED_REPOS_JSON: ${{ secrets.INFRA_ARCHIVED_REPOS }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          : "${GH_TOKEN:?INFRA_GITHUB_TOKEN is required for complete provider evidence}"
          : "${ACTIVE_REPOS_JSON:?INFRA_ACTIVE_REPOS is required}"
          : "${ARCHIVED_REPOS_JSON:?INFRA_ARCHIVED_REPOS is required}"

          private_dir="$(mktemp -d "${RUNNER_TEMP}/infra-reconcile.XXXXXX")"
          trap 'rm -f -- "$private_dir/live.txt" "$private_dir/managed.txt" "$private_dir/unmanaged.txt" "$private_dir/stale.txt"; rmdir "$private_dir" 2>/dev/null || true' EXIT

          if ! managed_repos=$(jq -cn \
              --arg owner "$OWNER" \
              --argjson active "$ACTIVE_REPOS_JSON" \
              --argjson archived "$ARCHIVED_REPOS_JSON" \
              '{owner: $owner, active: $active, archived: $archived}' \
              | jq -L .github/infra -er -f .github/infra/managed-repositories.jq); then
            echo "::error::private active and archived inventories are malformed, incomplete, or overlap"
            exit 1
          fi

          if ! live_pages=$(gh api --paginate --slurp \
              "user/repos?affiliation=owner&per_page=100" 2>/dev/null); then
            echo "::error::complete provider repository evidence is unavailable"
            exit 1
          fi
          if ! live_repos=$(jq -er --arg owner "$OWNER" \
              -f .github/infra/owned-repositories.jq <<<"$live_pages"); then
            echo "::error::complete provider repository evidence is malformed or belongs to another owner"
            exit 1
          fi
          printf '%s\n' "$live_repos" >"$private_dir/live.txt"

          printf '%s\n' "$managed_repos" >"$private_dir/managed.txt"

          comm -23 "$private_dir/live.txt" "$private_dir/managed.txt" >"$private_dir/unmanaged.txt"
          comm -13 "$private_dir/live.txt" "$private_dir/managed.txt" >"$private_dir/stale.txt"
          live_count=$(wc -l <"$private_dir/live.txt" | tr -d ' ')
          managed_count=$(wc -l <"$private_dir/managed.txt" | tr -d ' ')
          unmanaged_count=$(wc -l <"$private_dir/unmanaged.txt" | tr -d ' ')
          stale_count=$(wc -l <"$private_dir/stale.txt" | tr -d ' ')
          finding_count=$((unmanaged_count + stale_count))

          echo "Reconciled ${live_count} live and ${managed_count} managed repository identities; names withheld"
          {
            echo "live_count=$live_count"
            echo "managed_count=$managed_count"
            echo "unmanaged_count=$unmanaged_count"
            echo "stale_count=$stale_count"
            echo "finding_count=$finding_count"
          } >> "$GITHUB_ENV"

      - name: Open or update aggregate reconciliation issue
        if: ${{ env.finding_count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="infra inventory reconciliation drift detected"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Infra reconciliation found ${unmanaged_count} live-but-unmanaged and ${stale_count} managed-but-absent repository identity record(s). Exact identities are intentionally withheld from this public issue. Re-run in a private trusted environment with the canonical inventory. Run: ${run_url}"
          existing=$(gh issue list --repo "$REPO" --state open --label infra-unmanaged-repo --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --label infra-unmanaged-repo --body "$body"
          fi

      - name: Auto-close reconciliation issue after complete clean evidence
        if: ${{ env.finding_count == '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$REPO" --state open --label infra-unmanaged-repo --json number --jq '.[].number')
          for n in $existing; do
            gh issue close "$n" --repo "$REPO" --comment "Complete aggregate provider/IaC inventory evidence is clean; identities remain private."
          done

      - name: Enforce reconciliation result
        if: ${{ env.finding_count != '0' }}
        run: |
          echo "::error::${finding_count} aggregate inventory reconciliation finding(s); identities withheld"
          exit 1
