name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Daily 06:00 UTC — catches dependency CVEs and drift between PRs.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Principle of least privilege: jobs only need to read the repo and the
# go module cache. They never push branches, comment on PRs, or write to
# the security tab.
permissions:
  contents: read

jobs:
  ci:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Run the race detector on Linux only. Data races are
        # platform-independent in practice, so the ubuntu leg catches them;
        # the macOS leg runs the same suite without -race. This trims ~5 min
        # off every PR's macOS job and removes the instrumentation-induced
        # timing pressure that made the sub-millisecond timing tests flaky on
        # macOS. (A matrix var, not an inline `&& '' || '-race'` ternary,
        # because GitHub treats '' as falsy and the ternary would wrongly
        # re-add -race on macOS.)
        include:
          - os: ubuntu-latest
            race: "-race"
          - os: macos-latest
            race: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history required for two reasons:
          # (1) PR runs: golangci-lint new-from-merge-base needs the merge-base reachable.
          # (2) Push-to-main runs: golangci-lint --new-from-rev=HEAD~1 needs HEAD~1 reachable.
          # Without fetch-depth: 0 both baselines silently degrade to a full backlog scan.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install tmux (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install tmux

      - name: Install bubblewrap (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y bubblewrap

      - name: Download dependencies
        run: go mod download

      - name: Build
        # The first three binaries collide with same-named directories
        # under the repo root (./agm, ./agm-reaper exists as a dir, etc.),
        # so go build refuses to write the executable next to the source
        # tree. Force the output into a build/ directory keyed off the
        # binary name so each invocation has a unique destination.
        run: |
          GIT_COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w -X github.com/vbonnet/dear-agent/pkg/version.Version=2.0.0-dev -X github.com/vbonnet/dear-agent/pkg/version.GitCommit=${GIT_COMMIT} -X github.com/vbonnet/dear-agent/pkg/version.BuildDate=${BUILD_DATE} -X github.com/vbonnet/dear-agent/pkg/version.BuiltBy=ci"
          mkdir -p build
          go build -ldflags="${LDFLAGS}" -o build/agm ./agm/cmd/agm
          go build -ldflags="${LDFLAGS}" -o build/agm-reaper ./agm/cmd/agm-reaper
          go build -ldflags="${LDFLAGS}" -o build/agm-mcp-server ./agm/cmd/agm-mcp-server
          go build ./...
          # testscript_test.go in agm/test/e2e looks up agm at $HOME/go/bin/agm
          # before falling back to `go install <import-path>`; the install
          # fallback can fail in CI (proxy/sandbox), so pre-install here.
          go install ./agm/cmd/agm

      - name: Vet
        run: go vet ./...

      - name: Validate tracked AI skills
        run: go run ./tools/skill-lint -repo .

      - name: Verify generated AGM surfaces and plugin hashes
        run: |
          make verify-surface-codegen
          make plugin-verify-hashes

      - name: Test
        run: go test ${{ matrix.race }} -count=1 -timeout=20m ./...
        env:
          # Skip tmux-dependent tests on macOS CI
          CI_SKIP_TMUX: ${{ matrix.os == 'macos-latest' && 'true' || 'false' }}

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          # Pin to a specific version so linter upgrades are deliberate, not
          # silent. `latest` lets golangci-lint bump on its own schedule,
          # which can introduce new findings (e.g. SA5011) on an unrelated PR
          # and red main without any code change. Bump this intentionally.
          version: v2.12.2
          # On push-to-main: diff against the previous commit (HEAD~1) so
          # admin-bypass-merged PRs that skipped CI are still caught. On PRs:
          # pass nothing — .golangci.yml's new-from-merge-base: origin/main
          # takes effect and reports only code changed relative to main.
          # CLI args override config-file settings in golangci-lint v2.
          args: ${{ github.event_name == 'push' && '--new-from-rev=HEAD~1' || '' }}
          # Only push-to-main writes the lint cache; PR/schedule runs read it
          # but don't save, so transient PR branches can't churn or evict the
          # shared 10 GB Actions cache that main's hot path depends on.
          skip-save-cache: ${{ github.event_name != 'push' }}

  # Smart integration-test selection. The selector (cmd/test-affected)
  # walks the dependency graph from this branch vs. origin/main and runs
  # `go test -tags=integration` on only the packages whose deps actually
  # changed. Files that invalidate the graph itself (go.mod, go.sum,
  # Makefile, .github/workflows/, the selector source) deliberately fall
  # back to a full integration run — see cmd/test-affected/main.go.
  #
  # This is *additive*. The "Build & Test" job above still runs every
  # unit test on every PR; this job just narrows the integration suite
  # down to what the PR actually touches. Empty output = clean pass.
  #
  # Linux-only on purpose: integration tests rely on real tmux and
  # process behaviour that's flaky on the macOS runner. Mirror the
  # exclusion the unit-test job already encodes via CI_SKIP_TMUX.
  integration-tests:
    name: Integration Tests (affected)
    runs-on: ubuntu-latest
    # The sequential runner bounds are 20m for go list plus 55m for go test.
    # This 100m ultimate backstop leaves 25m around those phases; the BDD gate
    # requires at least one 20m native interval for setup, cleanup, and reports.
    timeout-minutes: 100
    # Only meaningful on PRs — we need a base ref to diff against. For
    # pushes to main/develop, the unit-test matrix above is the gate;
    # full integration sweeps belong in a scheduled or release workflow,
    # not on every commit to a long-lived branch.
    if: github.event_name == 'pull_request'
    # Suite has been green across multiple consecutive PRs (verified
    # 2026-06-12). Ratchet step: removed continue-on-error so failures
    # now block CI. Next admin step: add to branch-protection
    # required-status-checks.

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so we can git diff against the PR base ref.
          # Shallow clones make git diff $base...HEAD lie about which
          # files changed.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Download dependencies
        run: go mod download

      - name: Run affected integration tests
        env:
          # checkout@v6 with fetch-depth: 0 already gave us full history
          # for all branches the runner cloned; we just need to make sure
          # the PR base ref is present as a local remote-tracking ref so
          # the selector can `git diff origin/<base>...HEAD`.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          SKIP_E2E: "1"
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          go build -o "$RUNNER_TEMP/test-affected" ./cmd/test-affected
          "$RUNNER_TEMP/test-affected" --base="origin/${BASE_REF}" --tags=integration --run

  agm-codex-contracts:
    name: AGM Codex Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Download dependencies
        run: go mod download

      - name: Run credential-free active harness parity
        run: >-
          go test -race -count=1 -tags=integration
          ./agm/test/integration/portable
          -run 'TestActiveHarnessParityContract|TestHarnessPrerequisitesAreScoped'

      - name: Run active harness registry contract
        run: >-
          go test -race -count=1 -tags=contract
          ./agm/test/contract
          -run '^TestActiveHarnessRegistryContract$'

      - name: Run isolated source-built Codex lifecycle
        run: >-
          go test -race -count=1 -tags=integration
          ./agm/test/integration/isolated
          -run '^TestCodexLifecycleUsesIsolatedSourceEnvironment$'

      - name: Enforce critical lifecycle coverage ratchet
        run: >-
          go run ./cmd/coverage-ratchet
          --race
          --policy agm/test/coverage/critical-lifecycle.json

  agm-tagged-sweep:
    name: AGM Tagged Sweep
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: "go.sum"

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Download dependencies
        run: go mod download

      - name: Compile complete AGM integration-tagged graph
        run: go test -run '^$' -tags=integration ./agm/...

      - name: Run credential-free contract graph
        run: go test -race -count=1 -timeout=20m -tags=contract ./agm/test/contract/...

      - name: Run full integration graph with per-test prerequisite skips
        run: go test -race -count=1 -timeout=20m -tags=integration ./agm/test/integration/...

  engram-storage-hardening:
    name: Engram Storage Hardening
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: "go.sum"

      - name: Download dependencies
        run: go mod download

      - name: Race-test storage packages
        run: go test -race -count=1 -timeout=5m ./engram/internal/providers/simple ./engram/internal/reflection

      - name: Run fuzz seed corpus for storage validators
        run: go test -run=Fuzz -count=1 -timeout=5m ./engram/internal/providers/simple ./engram/internal/reflection

      - name: Run focused gosec scan
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.27.1 -quiet ./engram/internal/providers/simple/...

  # govulncheck runs inside the *required* CI workflow (not only the
  # separate, non-blocking Security Scan / SBOM workflows) so a known-vuln
  # dependency regression cannot merge to main. Mirrors the proven
  # invocation from security-scan.yml. To make this gate enforced, add
  # "CI / govulncheck" to the branch-protection required-status-checks
  # list (admin step — tracked by BL-061).
  #
  # Scoping (ce-1234-ci-health): "govulncheck" is a required status check,
  # so it must post on every PR/push or branch protection blocks the PR
  # forever. detect-go-changes always runs and decides whether the
  # dependency graph could have changed; the real scan only runs then
  # (Go compiles + govulncheck's DB download aren't free, and a PR that
  # touches neither Go code nor go.mod/go.sum can't have altered the
  # vulnerable-package set). govulncheck-gate always runs and carries the
  # required-check name, succeeding whenever the scan was skipped or
  # actually passed. schedule/workflow_dispatch runs always scan for
  # real — that's the daily drift-catcher for newly published CVEs
  # against unchanged dependencies.
  detect-go-changes:
    name: Detect Go dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_changes: ${{ steps.changed.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine changed Go files
        id: changed
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            range="${before}...${{ github.event.after }}"
          fi

          # ACMRT, not ACMR: a symlink replaced by a regular .go file is
          # status T, which ACMR drops — the file would enter the package
          # graph while this detector reported nothing and the required
          # gate skip-passed.
          #
          # Write to a file rather than piping into `grep -q`: under
          # `set -o pipefail`, grep -q exits at its first match, git diff
          # takes SIGPIPE and returns 141, and the whole pipeline fails —
          # which this `if` would misread as "nothing to scan" on exactly
          # the largest diffs.
          # -z so pathnames arrive verbatim. Under Git's default output a
          # path with non-ASCII bytes, a tab, or a newline is quoted and
          # backslash-escaped — `pkg/é.go` becomes "pkg/\303\251.go", the
          # `.go` suffix test fails, and govulncheck skip-passes on a PR
          # that did change Go source.
          git diff -z --name-only --diff-filter=ACMRT "$range" > /tmp/go_changed.z

          # The scanner's own policy counts as a scan input. A PR that
          # edits the govulncheck invocation or its vulnerability
          # allowlist but no Go file would otherwise satisfy the required
          # gate without ever executing the policy it just changed — a
          # broken scanner could merge and stay hidden until the next
          # scheduled run. security-audit.yml carries the mirrored
          # invocation; ci.yml carries the required one.
          has_changes=false
          while IFS= read -r -d '' path; do
            case "$path" in
              *.go|go.mod|go.sum|*/go.mod|*/go.sum \
              |.github/workflows/ci.yml|.github/workflows/security-audit.yml)
                has_changes=true
                break
                ;;
            esac
          done < /tmp/go_changed.z

          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"

  govulncheck-scan:
    name: govulncheck (scan)
    needs: detect-go-changes
    if: needs.detect-go-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # `-scan package` instead of default `-scan symbol`: the latter
      # builds SSA and panics inside golang.org/x/tools v0.44.0 lift on
      # tailscale.com's generic-heavy code paths. Package mode skips
      # SSA but flags any vulnerable package in the import graph,
      # including transitive ones we don't actually call. The jq pass
      # filters known-not-called false positives by GO ID.
      #
      # Allowlist (review on every dep bump):
      #   GO-2025-3884 — github.com/gorilla/csrf TrustedOrigins.
      #     Pulled in via tailscale.com/client/web. Fixed in: N/A.
      #     Our code never invokes csrf.Protect / TrustedOrigins;
      #     symbol-mode confirms (when run on Go ≥1.26 where the SSA
      #     panic is absent).
      #   GO-2026-5932 — golang.org/x/crypto/openpgp is unmaintained.
      #     Fixed in: N/A. Package scan reports the required module, while
      #     govulncheck confirms no affected package or symbol is imported.
      - name: Run govulncheck
        run: |
          set -euo pipefail
          govulncheck -format json -scan package ./... > vulncheck.json
          unhandled=$(jq -c \
            --argjson allow '["GO-2025-3884", "GO-2026-5932"]' \
            'select(.finding != null)
             | select(.finding.osv as $id | $allow | index($id) | not)
             | .finding' \
            vulncheck.json)
          if [ -n "$unhandled" ]; then
            echo "Unallowed vulnerabilities found:"
            echo "$unhandled"
            exit 1
          fi
          echo "No unallowed vulnerabilities."
        env:
          GOWORK: "off"

  govulncheck:
    # This job's name is the required-status-check context. It always
    # runs (never itself path-skipped), so branch protection always gets
    # a result. It mirrors govulncheck-scan's outcome when that job ran,
    # and succeeds when govulncheck-scan was legitimately skipped (no Go
    # dependency changes to scan).
    name: govulncheck
    needs: [detect-go-changes, govulncheck-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate
        run: |
          if [[ "${{ needs.detect-go-changes.result }}" != "success" ]]; then
            echo "detect-go-changes did not complete successfully: ${{ needs.detect-go-changes.result }}"
            exit 1
          fi
          if [[ "${{ needs.detect-go-changes.outputs.has_changes }}" != "true" ]]; then
            echo "No Go/go.mod/go.sum changes in this push/PR — nothing to scan."
            exit 0
          fi
          if [[ "${{ needs.govulncheck-scan.result }}" != "success" ]]; then
            echo "govulncheck-scan reported: ${{ needs.govulncheck-scan.result }}"
            exit 1
          fi
          echo "govulncheck-scan passed."
