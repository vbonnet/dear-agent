name: Cross-Platform Clean Install

# Verifies that a fresh clone builds and core packages pass tests on
# Linux, macOS (arm64), and Windows. This is a weekly canary, not a
# per-PR gate — the regular CI workflow (ci.yml) is the gate. The goal
# here is to catch platform-specific drift early (e.g. an engram file
# path that breaks on Windows) without burning CI minutes on every push.
#
# Windows builds the portable packages, then tests the Windows-safe Engram
# packages that exercise dreaming/memory file-ops. Some Engram packages still
# intentionally depend on Unix paths, Docker, or mutable user-home config.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'engram/**'
      - 'pkg/benchmarks/**'
      - '.github/workflows/cross-platform-test.yml'
  schedule:
    # Weekly on Sunday at 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

concurrency:
  group: cross-platform-test
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_TERMINAL_PROMPT: "0"

jobs:
  unix:
    name: Clean Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout (clean)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install tmux (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install tmux

      - name: Download modules
        run: go mod download

      - name: Build all binaries from scratch
        # Mirrors ci.yml's build layout: the repo has directories that
        # collide with binary names (./agm, ./agm-reaper) so binaries
        # must be written to build/.
        run: |
          GIT_COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w -X github.com/vbonnet/dear-agent/pkg/version.Version=2.0.0-dev -X github.com/vbonnet/dear-agent/pkg/version.GitCommit=${GIT_COMMIT} -X github.com/vbonnet/dear-agent/pkg/version.BuildDate=${BUILD_DATE} -X github.com/vbonnet/dear-agent/pkg/version.BuiltBy=cross-platform-test"
          mkdir -p build
          go build -ldflags="${LDFLAGS}" -o build/agm ./agm/cmd/agm
          go build -ldflags="${LDFLAGS}" -o build/agm-reaper ./agm/cmd/agm-reaper
          go build -ldflags="${LDFLAGS}" -o build/agm-mcp-server ./agm/cmd/agm-mcp-server
          go build ./...

      - name: Smoke-test AGM CLI
        run: |
          ./build/agm --version
          ./build/agm --help > /dev/null
          ./build/agm benchmark --help > /dev/null

      - name: Unit tests — dreaming / engram memory
        run: go test -count=1 -timeout 10m ./engram/...

      - name: Unit tests — benchmarks scaffolding
        run: go test -count=1 -timeout 5m ./pkg/benchmarks/...

      - name: Unit tests — AGM core (race detector)
        run: go test -race -count=1 -timeout 15m ./agm/internal/...
        env:
          CI_SKIP_TMUX: ${{ matrix.os == 'macos-latest' && 'true' || 'false' }}

  windows:
    name: Clean Install (windows-latest, portable subset)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (clean)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Download modules
        run: go mod download

      # The AGM CLI uses POSIX syscalls (Flock, Statfs) and tmux, so it
      # can't build on Windows. Engram builds on Windows, but not every
      # Engram test package is Windows-safe yet. The test list below
      # keeps memory, reflection, security, token, and retrieval file-op
      # coverage on pull requests without blocking on CLI, Docker, or
      # plugin-execution tests that still carry Unix assumptions.
      - name: Build portable packages
        run: |
          go build ./engram/...
          go build ./pkg/benchmarks/...

      - name: Unit tests — Windows-safe engram file ops
        run: >
          go test -count=1 -timeout 10m
          ./engram/internal/profile
          ./engram/internal/prompt
          ./engram/internal/providers/simple
          ./engram/internal/reflection
          ./engram/internal/retrieval
          ./engram/internal/scanners
          ./engram/internal/security
          ./engram/internal/signing
          ./engram/internal/slashcmd
          ./engram/internal/tableutil
          ./engram/internal/testutil
          ./engram/internal/tokens
          ./engram/internal/tokens/tokenizers
          ./engram/internal/tokentracking
          ./engram/retrieval

      - name: Unit tests — benchmarks scaffolding
        run: go test -count=1 -timeout 5m ./pkg/benchmarks/...

  summary:
    name: Summary
    needs: [unix, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Report
        run: |
          {
            echo "## Cross-Platform Clean Install"
            echo ""
            echo "| Job | Status |"
            echo "|---|---|"
            echo "| unix matrix | ${{ needs.unix.result }} |"
            echo "| windows (portable subset) | ${{ needs.windows.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
