name: Structural Health

# Purpose: surface and ratchet down structural drift in the codebase.
# The structural-health tool runs six scans (dead packages, oversized files,
# untested packages, broken ARCHITECTURE.md path references, unguarded
# goroutines, and raw macOS free-memory gates) and compares them against a
# checked-in baseline.
#
# This job FAILS ONLY ON REGRESSIONS — a finding that is new relative to
# .structural-health-baseline.json. Accepted findings remain visible in the
# baseline, and any new key makes the job red. To tighten the ratchet after
# fixing findings, run:
#
#   go run ./cmd/structural-health --update-baseline
#
# This command is shrink-only. Deliberately accepting new keys requires
# --accept-new plus a reason and durable reference; the exact transition is
# retained in the baseline. See cmd/structural-health/SPEC.md for the contract.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Principle of least privilege: this job only reads the repo. It never
# pushes branches, comments on PRs, or writes to the security tab.
permissions:
  contents: read

jobs:
  structural-health:
    name: Structural Health (baselined)
    # Non-required: pull requests run only with the `full-ci` label. Pushes to
    # main always run because the non-pull-request side of this condition wins.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Download dependencies
        run: go mod download

      # The scan shells out to `go list ./...` to build the import graph,
      # so the module must resolve. `go mod download` above primes the
      # cache; no build of the full tree is required.
      - name: Run structural-health scan
        run: go run ./cmd/structural-health
