name: Deepsec (incremental)

# Runs deepsec on PR-changed files only (vs the declared base branch) and posts
# candidate findings as a PR comment via `--comment-out`. Findings are advisory;
# promote the workflow to required once signal-to-noise stabilises.
#
# Cost: each `deepsec process` invocation calls the configured LLM. The
# job runs only when ANTHROPIC_API_KEY is set as a repo secret, so forks
# and unconfigured clones don't burn credits. Local runs use the developer's
# `claude` CLI subscription (free) — see docs/deepsec.md.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deepsec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Probe for secret presence without exposing the secret value as an output.
  # GitHub Actions job-level `if:` cannot reference secrets directly, so this
  # two-job split is the canonical pattern: check-key exports a plain boolean,
  # scan gates on it. When the key is absent the scan job shows as "Skipped"
  # (grey ⊘) rather than false-green ✅ (nothing scanned).
  check-key:
    # Skip forks and keep the paid path behind `full-ci`. A labeled event only
    # admits the label that activates this workflow, not unrelated later labels.
    if: >-
      (github.event.pull_request.head.repo.full_name == github.repository) &&
      contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' ||
       github.event.label.name == 'full-ci')
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.probe.outputs.has_key }}
    steps:
      - id: probe
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice ::ANTHROPIC_API_KEY not set — deepsec scan will be skipped. Add the secret to enable PR scans."
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

  scan:
    needs: check-key
    if: needs.check-key.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Need history so `--diff origin/main` can resolve the base.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install deepsec workspace
        working-directory: .deepsec
        run: pnpm install --frozen-lockfile

      - name: Run incremental scan
        id: scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          ./scripts/deepsec-incremental.sh \
            --since "origin/${{ github.event.pull_request.base.ref }}" \
            --comment-out /tmp/deepsec-comment.md
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ -f /tmp/deepsec-comment.md ] && [ -s /tmp/deepsec-comment.md ]; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment
        if: steps.scan.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Stamp the comment so future runs can find-and-replace rather
          # than spam. `gh pr comment` doesn't support edit-by-marker, so
          # we delete previous deepsec comments first.
          MARKER="<!-- deepsec-incremental -->"
          # Prepend marker if absent.
          if ! head -1 /tmp/deepsec-comment.md | grep -q "$MARKER"; then
            { echo "$MARKER"; cat /tmp/deepsec-comment.md; } > /tmp/deepsec-comment.body
            mv /tmp/deepsec-comment.body /tmp/deepsec-comment.md
          fi
          # Delete prior bot comments that carry the marker.
          gh api "repos/${{ github.repository }}/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" \
            | xargs -r -I {} gh api -X DELETE "repos/${{ github.repository }}/issues/comments/{}"
          gh pr comment "$PR" --body-file /tmp/deepsec-comment.md

      - name: Summarise (non-blocking)
        run: |
          if [ "${{ steps.scan.outputs.has_findings }}" = "true" ]; then
            echo "::warning ::Deepsec found candidate issues — see PR comment. Not blocking the merge."
          else
            echo "::notice ::Deepsec found no issues on changed files."
          fi
