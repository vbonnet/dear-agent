name: CSM E2E Installation Tests

on:
  push:
    branches: [ main, develop, refactor/csm-to-agm ]
    paths:
      - 'claude-session-manager/**'
      - '.github/workflows/csm-e2e-install.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'claude-session-manager/**'
      - '.github/workflows/csm-e2e-install.yml'

jobs:
  e2e-install:
    name: CSM E2E Install (${{ matrix.distro }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu
          - debian

    steps:
    - name: Checkout ai-tools
      uses: actions/checkout@v4

    - name: Checkout engram/core (dependency)
      uses: actions/checkout@v4
      with:
        repository: vbonnet/engram
        path: engram-checkout
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Prepare build context
      run: |
        mkdir -p build-context/ai-tools/main/claude-session-manager
        mkdir -p build-context/engram/main/core
        cp -r claude-session-manager/* build-context/ai-tools/main/claude-session-manager/
        cp -r engram-checkout/core/* build-context/engram/main/core/

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build ${{ matrix.distro }} test image
      run: |
        docker build \
          -f build-context/ai-tools/main/claude-session-manager/tests/e2e-install/Dockerfiles/${{ matrix.distro }}.Dockerfile \
          -t csm-test-${{ matrix.distro }} \
          build-context

    - name: Run ${{ matrix.distro }} E2E tests
      run: docker run --rm csm-test-${{ matrix.distro }}

    - name: Test summary
      if: always()
      run: |
        echo "## CSM E2E Installation Test Results (${{ matrix.distro }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ All tests passed on ${{ matrix.distro }}" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Tests failed on ${{ matrix.distro }}" >> $GITHUB_STEP_SUMMARY
        fi
