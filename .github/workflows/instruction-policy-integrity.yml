name: Instruction Policy Integrity

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integrity:
    name: Retired and prohibited guidance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate active instruction policy
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          baseline="$PR_BASE_SHA"
          if [[ -z "$baseline" ]]; then
            baseline="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$baseline" || "$baseline" == "0000000000000000000000000000000000000000" ]]; then
            baseline=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi
          if [[ -n "$baseline" ]]; then
            go run ./tools/instruction-lint -repo . -baseline-ref "$baseline"
          else
            go run ./tools/instruction-lint -repo .
          fi
