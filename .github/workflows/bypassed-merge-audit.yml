name: Bypassed Merge Audit

# Checks for PRs merged to main despite failing required CI checks (admin bypass).
# The enforce_admins:false hatch is kept deliberately for solo-dev lockout recovery,
# but every bypass should be visible — not silent.
#
# On detection, creates or updates a rolling issue labelled "bypassed-merge"
# so it shows up in the issue tracker. Auto-closes once the audit window is clean.
#
# Addresses ce-m3c: Flag bypassed merges in CI.

on:
  schedule:
    - cron: "30 14 * * *"   # daily at 14:30 UTC, offset from branch-protection-audit
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days to look back for merged PRs"
        default: "7"

permissions:
  issues: write
  contents: read

env:
  GIT_TERMINAL_PROMPT: "0"

jobs:
  audit:
    name: Bypassed Merge Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure bypassed-merge label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create bypassed-merge \
            --color "c5221f" \
            --description "PR merged with failing or pending CI checks" \
            --repo "$REPO" 2>/dev/null || true

      - name: Scan for merges on red
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
          # Optional. Only the ruleset-history calls use it, and only to learn
          # which checks were required at each merge. Absent, the audit says so
          # and reports its findings as unverified rather than as bypasses.
          INFRA_GITHUB_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Compute the earliest merge timestamp to consider.
          since=$(date -u -d "${LOOKBACK_DAYS} days ago" '+%Y-%m-%dT%H:%M:%SZ')
          echo "Scanning PRs merged to main since ${since} ..."

          # Fetch recently merged PRs.
          merged_prs=$(gh pr list \
            --repo "$REPO" \
            --state merged \
            --base main \
            --limit 100 \
            --json number,title,mergedAt,headRefOid \
            --jq "[.[] | select(.mergedAt >= \"${since}\")]")

          pr_count=$(echo "$merged_prs" | jq length)
          echo "Found ${pr_count} merged PRs in the window."

          # Resolve the checks actually required on main. The legacy branch
          # protection endpoint omits repository rulesets, so use the
          # effective-rules endpoint rather than treating every check run as
          # required. That keeps advisory bot failures visible in their own
          # workflows without creating a false bypassed-merge finding.
          required_checks=$(gh api "repos/${REPO}/rules/branches/main" \
            --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[]?.context] | unique') || {
              echo "::error::Could not resolve the required checks for main; refusing to classify merges."
              exit 1
            }
          echo "Required checks (current): ${required_checks}"

          # ...but "required" is a property of the moment the merge happened,
          # not of today. Making a check required retroactively converts every
          # merge in the lookback window that had it red into a bypass finding:
          # `Structural Health (baselined)` became required at 2026-08-20T03:58Z
          # and immediately accused PR #1253, merged 20 hours earlier when the
          # ruleset asked for six contexts and not that one.
          #
          # Rulesets carry a version history, so the set as it stood at a given
          # merge is recoverable. Fetch the version list once; per PR, take the
          # newest version whose updated_at precedes the merge.
          # Ruleset reads need repository-administration rights, and the
          # workflow GITHUB_TOKEN cannot be granted them: `administration` is a
          # fine-grained-PAT permission, NOT one of the GITHUB_TOKEN workflow
          # scopes. Naming it under `permissions:` makes the workflow file
          # invalid — the run dies before a single job starts, which is exactly
          # what #1324 did to main. Use an admin PAT when one is configured and
          # degrade honestly when it is not.
          ruleset_id=$(gh api "repos/${REPO}/rules/branches/main" \
            --jq '[.[] | .ruleset_id] | unique | first // empty' 2>/dev/null || true)
          ruleset_history=""
          if [ -n "${ruleset_id}" ]; then
            ruleset_history=$(GH_TOKEN="${INFRA_GITHUB_TOKEN:-$GH_TOKEN}" \
              gh api "repos/${REPO}/rulesets/${ruleset_id}/history" --paginate \
              --jq '[.[] | {version_id, updated_at}] | sort_by(.updated_at)' 2>/dev/null || true)
          fi
          # Check the SHAPE, not just non-emptiness: a 403 body or an error
          # object still parses as "something", and the first cut treated that
          # as a usable history.
          if ! jq -e 'type == "array" and length > 0 and (.[0] | has("version_id"))' \
               <<<"${ruleset_history:-null}" >/dev/null 2>&1; then
            echo "::warning::Ruleset history unavailable (needs an admin PAT in INFRA_GITHUB_TOKEN); findings are UNVERIFIED against the rules in force at merge time."
            ruleset_history=""
          else
            echo "Ruleset history: $(jq -r 'length' <<<"${ruleset_history}") version(s) available."
          fi

          # required_at <merged_at> — echoes the contexts required at that
          # instant, falling back to the current set when history cannot answer.
          # Every fallback path announces itself. The first cut of this was silent
          # on failure, so a 403 on the history endpoint looked identical to a
          # successful lookup: the log printed a required set with no hint it was
          # today's rather than the merge's, and the finding it produced was
          # indistinguishable from a real one.
          required_at() {
            local merged="$1" version cached contexts
            if [ -z "${ruleset_history}" ]; then
              printf '%s' "${required_checks}"; return
            fi
            version=$(jq -r --arg m "${merged}" \
              '[.[] | select(.updated_at <= $m)] | last | .version_id // empty' <<<"${ruleset_history}")
            # A merge older than every recorded version: the oldest version is
            # the closest evidence available, and is still better than today's.
            [ -z "${version}" ] && version=$(jq -r 'first | .version_id // empty' <<<"${ruleset_history}")
            if [ -z "${version}" ]; then
              echo "::warning::no ruleset version resolvable for a merge at ${merged}; using today's required set" >&2
              printf '%s' "${required_checks}"; return
            fi
            cached="/tmp/ruleset-${version}.json"
            if [ ! -f "${cached}" ]; then
              if ! GH_TOKEN="${INFRA_GITHUB_TOKEN:-$GH_TOKEN}" \
                   gh api "repos/${REPO}/rulesets/${ruleset_id}/history/${version}" > "${cached}" 2>/dev/null; then
                rm -f "${cached}"
                echo "::warning::could not read ruleset version ${version}; using today's required set" >&2
                printf '%s' "${required_checks}"; return
              fi
            fi
            contexts=$(jq -c '[.state.rules[]? | select(.type == "required_status_checks")
                    | .parameters.required_status_checks[]?.context] | unique' "${cached}" 2>/dev/null || true)
            if [ -z "${contexts}" ] || [ "${contexts}" = "null" ]; then
              echo "::warning::ruleset version ${version} carried no required-status-checks rule; using today's required set" >&2
              printf '%s' "${required_checks}"; return
            fi
            echo "ruleset-version=${version}" >&2
            printf '%s' "${contexts}"
          }

          findings=""

          while IFS= read -r pr_json; do
            number=$(echo "$pr_json" | jq -r '.number')
            title=$(echo "$pr_json"  | jq -r '.title')
            merged_at=$(echo "$pr_json" | jq -r '.mergedAt')
            head_sha=$(echo "$pr_json"  | jq -r '.headRefOid')

            echo "--- PR #${number}: ${title} (merged ${merged_at}, head=${head_sha})"

            # The required set as it stood when THIS pull request merged.
            pr_required=$(required_at "${merged_at}")
            [ -z "${pr_required}" ] && pr_required="${required_checks}"
            echo "    required at merge: ${pr_required}"

            # Fetch check-runs for the PR's HEAD commit.
            check_runs=$(gh api "repos/${REPO}/commits/${head_sha}/check-runs" \
              --jq '.check_runs // []' 2>/dev/null || echo '[]')

            # Checks that completed with a non-success conclusion BEFORE the merge.
            red=$(echo "$check_runs" | jq -r \
              --argjson required "$pr_required" \
              --arg merged "$merged_at" \
              '[.[] | select(.name as $name | ($required | index($name)) != null) | select(
                  .status == "completed" and
                  (.conclusion // "") != "" and
                  (.conclusion // "") != "success" and
                  (.conclusion // "") != "skipped" and
                  (.conclusion // "") != "neutral" and
                  (.completed_at // "z") <= $merged
              ) | "\(.name) [\(.conclusion)]"] | join(", ")')

            # Checks that were still running (started but not completed) at merge time.
            pending=$(echo "$check_runs" | jq -r \
              --argjson required "$pr_required" \
              --arg merged "$merged_at" \
              '[.[] | select(.name as $name | ($required | index($name)) != null) | select(
                  (.started_at // "z") <= $merged and
                  (.status != "completed" or (.completed_at // "z") > $merged)
              ) | .name] | join(", ")')

            if [ -n "$red" ] || [ -n "$pending" ]; then
              entry="- **PR #${number}** — ${title}"
              [ -n "$red" ]     && entry="${entry} | ❌ failed: ${red}"
              [ -n "$pending" ] && entry="${entry} | ⏳ in-progress at merge: ${pending}"
              entry="${entry} (merged ${merged_at})"
              findings="${findings}"$'\n'"${entry}"
              echo "  BYPASS DETECTED: ${entry}"
            else
              echo "  ok — all checks green at merge time"
            fi
          done < <(echo "$merged_prs" | jq -c '.[]')

          # Export findings for the next steps.
          {
            echo "findings<<__EOF__"
            printf '%s\n' "$findings"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Open / update bypassed-merge issue
        if: env.findings != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="bypassed-merge: PRs merged with failing or pending required checks"
          body="The Bypassed Merge Audit detected PRs merged to \`main\` while required CI checks were not all green:

          ${findings}

          **What this means:** \`enforce_admins: false\` allows admin merges that bypass
          required-status-checks. This is intentional for solo-dev lockout recovery, but
          every bypass should be visible and investigated.

          **If intentional:** reply to this issue explaining why.
          **If accidental:** consider reverting the merge or adding a follow-up fix.

          _Auto-managed by \`.github/workflows/bypassed-merge-audit.yml\`; closes once
          the lookback window contains no bypasses._"

          existing=$(timeout 30 gh issue list \
            --repo "$REPO" \
            --label "bypassed-merge" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            timeout 30 gh issue comment "$existing" \
              --repo "$REPO" \
              --body "$body"
            echo "Updated existing issue #${existing}"
          else
            timeout 30 gh issue create \
              --repo "$REPO" \
              --title "$title" \
              --body "$body" \
              --label "bypassed-merge"
            echo "Created new issue"
          fi

      - name: Auto-close bypassed-merge issue when window is clean
        if: env.findings == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          open_issues=$(timeout 30 gh issue list \
            --repo "$REPO" \
            --label "bypassed-merge" \
            --state open \
            --json number \
            --jq '.[].number')
          for n in $open_issues; do
            timeout 30 gh issue close "$n" \
              --repo "$REPO" \
              --comment "No bypassed merges in the audit window; auto-closing."
            echo "Closed issue #${n}"
          done
