name: AGM E2E Installation Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'agm/**'
      - '.github/workflows/agm-e2e-install.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'agm/**'
      - '.github/workflows/agm-e2e-install.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-install:
    name: AGM E2E Install (${{ matrix.distro }})
    # Non-required: gate the per-push hot path behind the `full-ci` label.
    # push (main/develop), merge_group, and workflow_dispatch still run.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu
          - debian

    steps:
    - name: Checkout ai-tools
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

    - name: Cache Docker layers
      uses: actions/cache@v6
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ matrix.distro }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-buildx-${{ matrix.distro }}-

    - name: Build ${{ matrix.distro }} test image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
      with:
        context: .
        file: agm/tests/e2e-install/Dockerfiles/${{ matrix.distro }}.Dockerfile
        tags: agm-test-${{ matrix.distro }}:latest
        load: true
        cache-from: type=local,src=/tmp/.buildx-cache
        # mode=min caches only the layers of the final image, not every
        # intermediate build stage. mode=max roughly doubled the on-disk
        # cache (~1 GB per distro × 2 = ~2 GB) and was the dominant driver
        # of the repo's Actions cache crossing the 10 GB ceiling, which
        # triggers LRU eviction of the Go build caches and cold rebuilds.
        # The final-image layers are what cache-from restores anyway, so
        # min preserves the speedup at a fraction of the size.
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=min

    - name: Run ${{ matrix.distro }} E2E tests
      run: docker run --rm agm-test-${{ matrix.distro }}

    - name: Post-install verification (agm doctor)
      run: |
        docker run --rm agm-test-${{ matrix.distro }} \
          /bin/bash -c 'agm admin doctor 2>&1; exit_code=$?; if [ $exit_code -ne 0 ]; then echo "CRITICAL: agm doctor failed with exit code $exit_code"; exit 1; fi'

    - name: Rotate cache
      if: always()
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache 2>/dev/null || true

    - name: Cleanup Docker resources
      if: always()
      run: |
        docker rmi agm-test-${{ matrix.distro }} 2>/dev/null || true
        docker builder prune -f 2>/dev/null || true

    - name: Test summary
      if: always()
      run: |
        echo "## AGM E2E Installation Test Results (${{ matrix.distro }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ ${{ job.status }} == 'success' ]; then
          echo "All tests passed on ${{ matrix.distro }}" >> $GITHUB_STEP_SUMMARY
        else
          echo "Tests failed on ${{ matrix.distro }}" >> $GITHUB_STEP_SUMMARY
        fi
