# Gemini Code Assist configuration for the dear-agent repository.
#
# Reference: https://docs.cloud.google.com/gemini/docs/code-review/customize-repo-review
#
# NOTE ON BILLING / GCP PROJECT:
#   This file does NOT and CANNOT select the GCP project or billing tier — there
#   is no project-ID field in the schema. Linking reviews to a paid Google Cloud
#   project (instead of the free individual tier) is a one-time Cloud Console
#   action via Developer Connect:
#     Cloud Console → Gemini Code Assist → Agents & Tools → enable the
#     "Source Code Management" agent → create a Developer Connect connection
#     (us-east1) → authenticate GitHub + install the app → link this repo.
#   Requires: a billing-enabled project, Developer Connect API enabled, and the
#   Service Usage Admin + geminicodeassistmanagement.scmConnectionAdmin roles.
#   See PR description for the candidate projects.

have_fun: false

# Persistent cross-PR memory ("improved response quality"). Left enabled.
memory_config:
  disabled: false

code_review:
  disable: false
  # Only surface MEDIUM+ findings to keep review signal high on a fast-moving
  # repo. Raise to HIGH if comment volume is noisy.
  comment_severity_threshold: MEDIUM
  # No cap — let the reviewer report everything above the threshold.
  max_review_comments: -1
  pull_request_opened:
    # No help banner on every PR open.
    help: false
    # Post a summary on PR open — useful for the multi-agent / burndown flow.
    summary: true
    # Post a full code review on PR open (the whole point of the integration).
    code_review: true
    # Don't burn quota reviewing drafts; review once they're ready.
    include_drafts: false

# Files Gemini should not review. Generated, vendored, and lockfile noise only;
# do NOT add source paths here — that would silently shrink review coverage.
ignore_patterns:
  - "**/*.pb.go"
  - "**/*_generated.go"
  - "**/mock_*.go"
  - "**/testdata/**"
  - "vendor/**"
  - "**/go.sum"
  - "**/package-lock.json"
  - "**/*.min.js"
