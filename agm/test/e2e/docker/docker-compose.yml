services:
  reaper-e2e-test:
    build:
      context: ../../../../
      dockerfile: agm/test/e2e/docker/Dockerfile
    image: agm-reaper-e2e:latest
    container_name: agm-reaper-e2e
    environment:
      - SESSIONS_DIR=/home/testuser/sessions
      - AGM_TEST_MODE=true
      - HOME=/home/testuser
      # The reaper resolves its target through the lifecycle store, so every
      # process in the container — agm, agm-reaper, and the fixture seeder —
      # must agree on one isolated database.
      - AGM_DB_PATH=/home/testuser/agm.db
      # tmux socket the tests create their panes on. Without this the reaper
      # would look on the default $HOME/.agm/agm.sock and never find the pane.
      - AGM_TMUX_SOCKET=/tmp/agm.sock
    volumes:
      # Mount test scripts
      - ./scripts:/home/testuser/tests:ro
      # Mount built binaries (will be built before docker-compose up)
      - ../../../../bin/agm:/home/testuser/bin/agm:ro
      - ../../../../bin/agm-reaper:/home/testuser/bin/agm-reaper:ro
      - ../../../../bin/seed-session:/home/testuser/bin/seed-session:ro
      - ../../../../bin/claude:/home/testuser/bin/claude:ro
      # Mount test results output
      - ./test-results:/home/testuser/test-results:rw
    working_dir: /home/testuser
    command: /home/testuser/tests/run-reaper-tests.sh
